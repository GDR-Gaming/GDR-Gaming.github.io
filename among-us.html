<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GDR - Among Us (Innersloth)</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --accent-yellow: #eab308;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --overlay-dark: rgba(0, 0, 0, 0.6);
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        /* RESET TOTAL PARA ELIMINAR BORDES BLANCOS */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color); /* Color oscuro en toda la pantalla */
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            /* Espacio para que el buscador no tape el logo */
            padding-top: env(safe-area-inset-top, 30px); 
        }

        .mobile-container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        /* IMAGEN PRINCIPAL: Ocupa todo el ancho sin bordes laterales */
        .hero-section {
            position: relative;
            width: 100%;
            height: 55vh;
            background: url('1778216047984~2.jpg') center top/cover;
            border-radius: 0 0 35px 35px; /* Redondeado solo abajo */
        }

        .stats-overlay {
            position: absolute; top: 20px; right: 20px;
            background: var(--overlay-dark);
            backdrop-filter: blur(10px);
            padding: 10px; border-radius: 15px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 10;
        }

        .stat-item {
            display: flex; flex-direction: column; align-items: center; font-size: 11px;
        }
        .stat-item i { font-size: 20px; }
        .ri-heart-fill { color: #ef4444; }
        .ri-eye-fill { color: #fbbf24; }
        .ri-bookmark-fill { color: var(--accent-yellow); }

        .content-section {
            padding: 25px 20px;
            flex-grow: 1;
        }

        .game-info h1 { font-weight: 800; font-size: 30px; margin: 0; }
        .game-info p { color: var(--text-muted); opacity: 0.8; font-size: 14px; margin: 5px 0 0; }

        .action-bar {
            display: flex; justify-content: space-between; gap: 10px; margin: 25px 0;
        }

        .btn-tactical {
            flex: 1; padding: 12px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: white; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            text-decoration: none; font-size: 12px;
        }

        .btn-play { border-color: var(--accent-yellow); color: var(--accent-yellow); }

        .description-box { margin-bottom: 100px; }
        .description-text { line-height: 1.6; color: var(--text-muted); font-size: 14px; }
        .ver-mas { color: var(--accent-yellow); font-weight: bold; }

        .metadata-badges { display: flex; gap: 8px; margin: 15px 0; }
        .badge {
            padding: 4px 10px; border-radius: 6px;
            background: rgba(255,255,255,0.1); font-size: 11px;
            color: var(--text-muted);
        }

        /* DOCK FIJO ABAJO */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            padding: 20px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around;
            z-index: 100;
        }
        .nav-icon { font-size: 22px; color: var(--text-main); opacity: 0.4; }
        .nav-icon.active { opacity: 1; color: var(--accent-yellow); }
    </style>
</head>
<body>

    <div class="mobile-container">
        <section class="hero-section">
            <div class="stats-overlay">
                <div class="stat-item"><i class="ri-heart-fill"></i> 3.1M</div>
                <div class="stat-item"><i class="ri-eye-fill"></i> 2.8M</div>
                <div class="stat-item"><i class="ri-bookmark-fill"></i></div>
            </div>
        </section>

        <section class="content-section">
            <div class="game-info">
                <h1>AMONG US</h1>
                <p>Version: 2024.1.2 - Immersive Game</p>
            </div>

            <div class="action-bar">
                <a href="https://play.google.com/store/apps/details?id=com.innersloth.spacemafia" class="btn-tactical btn-play">
                    <i class="ri-play-mini-fill"></i> PLAY
                </a>
                <button class="btn-tactical"><i class="ri-add-line"></i> WATCHLIST</button>
                <button class="btn-tactical" onclick="compartir()"><i class="ri-share-forward-line"></i> SHARE</button>
            </div>

            <div class="description-box">
                <p class="description-text">
                    Among Us es un juego de deducción social ambientado en el espacio. El objetivo es completar tareas mientras evitas ser eliminado por el Impostor... <span class="ver-mas">ver más</span>
                </p>
                <div class="metadata-badges">
                    <div class="badge">PEGI 7</div>
                    <div class="badge">UHD</div>
                    <div class="badge">CC</div>
                </div>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 10px;">
                    Lanzamiento: 2018 • Acción • Misterio
                </p>
            </div>
        </section>

        <nav class="bottom-nav">
            <i class="ri-home-5-fill nav-icon"></i>
            <i class="ri-search-line nav-icon"></i>
            <i class="ri-heart-3-line nav-icon"></i>
            <i class="ri-tv-2-line nav-icon active"></i>
            <i class="ri-user-fill nav-icon"></i>
        </nav>
    </div>

    <script>
        function compartir() {
            if (navigator.share) {
                navigator.share({ title: 'Among Us', url: window.location.href });
            }
        }
    </script>
</body>
</html>
