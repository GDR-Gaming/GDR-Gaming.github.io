<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GDR - Among Us</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');

        :root {
            --bg-dark: #0a0f1a;
            --accent-yellow: #eab308;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* FONDO FIJO Y FLUIDO */
        .background-blur {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background: url('1778216047984~2.jpg') center/cover no-repeat;
            transform: scale(1.4);
            filter: blur(35px) brightness(0.25);
            z-index: -1;
        }

        .mobile-wrapper {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 110px 20px 120px 20px; 
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* TARJETA PRINCIPAL */
        .main-card {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7);
            background: url('1778216047984~2.jpg') center/cover;
        }

        .card-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 20%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 30px;
        }

        .card-overlay h1 { font-size: 28px; font-weight: 800; text-transform: uppercase; }
        .card-overlay p { font-size: 14px; color: #cbd5e1; margin-top: 5px; }

        /* ICONOS LATERALES */
        .side-stats {
            position: absolute;
            top: 25px; right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-bubble {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: 14px;
            text-align: center;
            min-width: 50px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-bubble i { font-size: 18px; display: block; }
        .ri-heart-fill { color: #ff4d4d; }
        .ri-eye-fill { color: #facc15; }
        .stat-bubble span { font-size: 10px; font-weight: 700; }

        /* BOTONES AJUSTADOS */
        .action-row { display: flex; gap: 10px; }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 9px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .btn-highlight { border-color: var(--accent-yellow); color: var(--accent-yellow); }

        /* INFO SECCIÓN */
        .desc-text { font-size: 14px; line-height: 1.6; color: #cbd5e1; }
        .ver-mas { color: var(--accent-yellow); font-weight: 800; }

        .meta-tags { display: flex; gap: 8px; margin: 15px 0; }
        .tag {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 7px;
            font-size: 10px;
            font-weight: 700;
        }

        /* NAVEGACIÓN */
        .nav-dock {
            position: fixed;
            bottom: 25px; left: 25px; right: 25px;
            height: 65px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(25px);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .nav-item { color: #fff; opacity: 0.4; font-size: 22px; }
        .nav-item.active { opacity: 1; color: var(--accent-yellow); }
    </style>
</head>
<body>

    <div class="background-blur"></div>

    <div class="mobile-wrapper">
        
        <div class="main-card">
            <div class="side-stats">
                <div class="stat-bubble"><i class="ri-heart-fill"></i><span>3.1M</span></div>
                <div class="stat-bubble"><i class="ri-eye-fill"></i><span>2.8M</span></div>
                <div class="stat-bubble"><i class="ri-bookmark-fill" style="color:#facc15"></i></div>
            </div>

            <div class="card-overlay">
                <h1>AMONG US</h1>
                <p>Versión: 2024.1.2 - Immersive Game</p>
            </div>
        </div>

        <div class="action-row">
            <a href="https://play.google.com/store/apps/details?id=com.innersloth.spacemafia" class="btn">
                <i class="ri-play-fill"></i> PLAY
            </a>
            
            <button class="btn" onclick="alert('Iniciando anuncio...')">
                <i class="ri-vidicon-line"></i> ADS / WATCH
            </button>
            
            <button class="btn btn-highlight" onclick="compartir()">
                <i class="ri-share-forward-line"></i> RECOMMEND
            </button>
        </div>

        <div class="info-section">
            <p class="desc-text">
                Among Us es un juego de deducción social ambientado en el espacio. El objetivo es completar tareas mientras evitas ser eliminado por el Impostor... <span class="ver-mas">ver más</span>
            </p>
            
            <div class="meta-tags">
                <div class="tag">Disney+</div>
                <div class="tag">PEGI 7</div>
                <div class="tag">UHD</div>
                <div class="tag">CC</div>
            </div>

            <p style="font-size: 12px; color: var(--text-muted);">
                Lanzamiento: 2018 • Acción • Multijugador • Misterio
            </p>
        </div>

    </div>

    <nav class="nav-dock">
        <i class="ri-home-5-fill nav-item active"></i>
        <i class="ri-search-line nav-item"></i>
        <i class="ri-heart-3-line nav-item"></i>
        <i class="ri-play-list-add-line nav-item"></i>
        <div style="width:28px; height:28px; background:#555; border-radius:50%"></div>
    </nav>

    <script>
        function compartir() {
            if (navigator.share) {
                navigator.share({
                    title: 'GDR - Among Us',
                    text: '¡Mira este juego!',
                    url: window.location.href
                });
            } else {
                alert('Enlace copiado al portapapeles');
            }
        }
    </script>
</body>
</html>
