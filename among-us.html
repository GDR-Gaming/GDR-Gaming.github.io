<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GDR - Among Us (Innersloth)</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* === ESTILOS TIPO MOBILE APP === */
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-yellow: #eab308;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
            --overlay-dark: rgba(0, 0, 0, 0.6);
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex; flex-direction: column; min-height: 100vh;
            /* EVITA QUE EL NAVEGADOR CORTE LO DE ARRIBA */
            padding-top: env(safe-area-inset-top, 20px);
        }

        .mobile-container {
            max-width: 450px;
            margin: 0 auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* AJUSTE DE IMAGEN: Bajamos un poco la posición para que no se corte el logo */
        .hero-section {
            position: relative;
            width: 100%; 
            height: 55vh; /* Un poco más alta para dar aire */
            background: url('1778216047984~2.jpg') no-repeat center 20%; /* Baja la imagen un 20% */
            background-size: cover;
            border-radius: 0 0 30px 30px;
            margin-top: 10px; /* Despeja el borde superior */
        }

        /* Bajamos un poco los stats para que no choquen con el borde */
        .stats-overlay {
            position: absolute; top: 30px; right: 20px;
            background: var(--overlay-dark);
            backdrop-filter: blur(10px);
            padding: 10px; border-radius: 15px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 10;
        }

        .stat-item {
            display: flex; flex-direction: column; align-items: center; font-size: 11px;
            cursor: pointer;
        }
        .stat-item i { font-size: 20px; }
        .ri-heart-fill { color: #ef4444; }
        .ri-eye-fill { color: #fbbf24; }
        .ri-bookmark-fill { color: var(--accent-yellow); }

        .content-section {
            padding: 20px;
            background: linear-gradient(to bottom, transparent, var(--bg-color) 10%);
            margin-top: -40px; 
            border-radius: 30px 30px 0 0;
            position: relative; z-index: 5;
            flex-grow: 1;
        }

        .game-info h1 { font-weight: 800; font-size: 28px; margin-bottom: 5px; }
        .game-info p { color: var(--text-muted); opacity: 0.7; font-size: 14px; margin-top: 0; }

        .action-bar {
            display: flex; justify-content: space-between; gap: 10px; margin: 20px 0;
        }

        .btn-tactical {
            flex: 1; padding: 12px 10px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: white; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            text-decoration: none; font-size: 12px;
        }

        .btn-play { border-color: var(--accent-yellow); color: var(--accent-yellow); }

        .description-box { margin: 20px 0; }
        .description-text { line-height: 1.6; color: var(--text-muted); font-size: 14px; }
        .ver-mas { color: var(--accent-yellow); cursor: pointer; }

        .metadata-badges { display: flex; gap: 10px; margin: 15px 0; }
        .badge {
            padding: 5px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.1); font-size: 11px;
            color: var(--text-muted);
        }

        .bottom-nav {
            position: sticky; bottom: 0;
            background: rgba(15,20,30,0.95); backdrop-filter: blur(15px);
            padding: 20px 25px; 
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-icon { font-size: 22px; color: var(--text-main); opacity: 0.5; }
        .nav-icon.active { opacity: 1; color: var(--accent-yellow); }

    </style>
</head>
<body>

    <div class="mobile-container">
        
        <section class="hero-section">
            <div class="stats-overlay">
                <div class="stat-item">
                    <i class="ri-heart-fill"></i> 3.1M
                </div>
                <div class="stat-item">
                    <i class="ri-eye-fill"></i> 2.8M
                </div>
                <div class="stat-item">
                    <i class="ri-bookmark-fill"></i>
                </div>
            </div>
        </section>

        <section class="content-section">
            <div class="game-info">
                <h1>AMONG US</h1>
                <p>Version: 2024.1.2 - Immersive Game</p>
            </div>

            <div class="action-bar">
                <a href="https://play.google.com/store/apps/details?id=com.innersloth.spacemafia" class="btn-tactical btn-play">
                    <i class="ri-play-mini-fill"></i> PLAY
                </a>
                
                <button class="btn-tactical" onclick="alert('Abriendo anuncios...')">
                    <i class="ri-add-line"></i> WATCHLIST
                </button>
                
                <button class="btn-tactical" onclick="compartirApp()">
                    <i class="ri-share-forward-line"></i> COMPARTIR
                </button>
            </div>

            <div class="description-box">
                <p class="description-text">
                    Among Us es un juego de deducción social ambientado en el espacio. El objetivo es completar tareas mientras evitas ser eliminado por el Impostor... <span class="ver-mas">ver más</span>
                </p>
                <div class="metadata-badges">
                    <div class="badge">PEGI 7</div>
                    <div class="badge">UHD</div>
                    <div class="badge">CC</div>
                </div>
                <p style="font-size: 12px; color: var(--text-muted);">
                    Lanzamiento: 2018 • Acción • Multijugador • Misterio
                </p>
            </div>
        </section>

        <nav class="bottom-nav">
            <i class="ri-home-5-fill nav-icon"></i>
            <i class="ri-search-line nav-icon"></i>
            <i class="ri-heart-3-line nav-icon"></i>
            <i class="ri-tv-2-line nav-icon active"></i>
            <i class="ri-user-fill nav-icon"></i>
        </nav>

    </div>

    <script>
        function compartirApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'GDR - Among Us',
                    text: '¡Mira este juego en el Top 10!',
                    url: window.location.href
                });
            } else {
                alert('Función de compartir no disponible.');
            }
        }
    </script>

</body>
</html>
