<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDR - Glitch Dimension Racing</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        header { border-bottom: 2px solid #58a6ff; padding-bottom: 20px; }
        h1 { color: #58a6ff; font-size: 2.5em; text-transform: uppercase; letter-spacing: 2px; }
        .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; width: 300px; transition: 0.3s; }
        .card:hover { border-color: #58a6ff; }
        .btn { background: #238636; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; }
        .ranking { text-align: left; background: #000; padding: 15px; border-radius: 8px; }
        .versus-btn { width: 45%; background: #21262d; color: white; border: 1px solid #30363d; padding: 10px; border-radius: 5px; cursor: pointer; }
        .versus-btn:hover { background: #58a6ff; }
    </style>
</head>
<body>

<header>
    <h1>GDR - Glitch Dimension Racing</h1>
    <p>Reviews de Tecnología • Gaming • Chollos</p>
</header>

<div class="grid">
    <div class="card">
        <h3>🔥 Oferta del Día</h3>
        <p>Auriculares Gamer Ultrapods Max</p>
        <p style="color: #3fb950; font-size: 1.2em;"><strong>$13.500</strong></p>
        <a href="#" class="btn">VER EN MERCADO LIBRE</a>
    </div>

    <div class="card">
        <h3>📈 Lo más buscado</h3>
        <div class="ranking">
            <p>1. PS5 Pro 🎮</p>
            <p>2. iPhone 17 📱</p>
            <p>3. Roblox Scripts 💻</p>
        </div>
    </div>

    <div class="card">
        <h3>⚔️ El Versus GDR</h3>
        <p>¿Qué preferís hoy?</p>
        <button class="versus-btn">PC</button>
        <button class="versus-btn">Consola</button>
    </div>
</div>

</body>
</html>
