<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GDR - Honor of Kings Premium UI</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* === FUENTES FANTASY === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:wght@600;800&family=Inter:wght@400;700&display=swap');

        :root {
            --gold-light: #e6dcc6;
            --gold-warm: #b69865;
            --magic-cyan: #00f0ff;
            --parchment: #f5e9d2;
            --bg-dark: #0a0806;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* === FONDO: TEMPLO FANTÁSTICO (DEPTH OF FIELD) === */
        .temple-bg {
            position: fixed; inset: 0;
            background-image: url('https://images.unsplash.com/photo-1605806616949-1e87b487fc2f?q=80&w=2070&auto=format&fit=crop'); /* Imagen de base tipo templo */
            background-size: cover; background-position: center;
            filter: blur(12px) brightness(0.4) contrast(1.1); /* Fuerte desenfoque DoF */
            z-index: -10;
        }
        .temple-glow {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, rgba(182, 152, 101, 0.2) 0%, transparent 70%);
            z-index: -9;
        }

        /* === HEADER: HONOR OF KINGS === */
        .game-header {
            padding: 40px 25px 0;
            text-align: center;
            z-index: 20;
        }
        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 48px; font-weight: 900;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.8), 0 0 15px rgba(230, 220, 198, 0.3);
            position: relative; display: inline-block;
        }
        /* Runas mágicas */
        .game-title::after {
            content: 'ᛗᚱ'; font-size: 20px; color: var(--magic-cyan);
            position: absolute; right: -45px; top: 15px;
            filter: drop-shadow(0 0 5px var(--magic-cyan)); opacity: 0.8;
        }

        .game-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: 15px; color: var(--gold-light);
            text-align: left; max-width: 300px;
            margin: 15px auto 0; line-height: 1.4;
            opacity: 0.9; position: relative;
        }

        /* === CARTEL PERGAMINO CENTRAL (CTA) === */
        .cta-container {
            margin: 30px auto;
            position: relative;
            z-index: 30;
            perspective: 1000px;
        }
        .parchment-banner {
            background-color: var(--parchment);
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            width: 260px; padding: 15px 20px 20px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 30px rgba(139, 115, 85, 0.3);
            border: 1px solid #d4c4a8;
            transform: rotateX(5deg);
            position: relative;
        }
        /* Sello de cera */
        .wax-seal {
            position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
            width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle, #8c6a46, #5c432a);
            border: 3px solid #4a3521;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
        }
        .wax-seal i { color: rgba(255,255,255,0.4); font-size: 28px; }

        .parchment-text {
            margin-top: 25px; text-align: center;
            font-family: 'Playfair Display', serif;
            font-weight: 800; font-size: 16px; color: #3d2f22;
        }

        /* === TARJETA PERSONAJE PREMIUM === */
        .card-frame {
            width: 280px; height: 280px;
            margin: 0 auto;
            position: relative;
            border-radius: 15px;
            padding: 8px;
            /* Marco ornamentado turquesa/dorado */
            background: linear-gradient(135deg, #00f0ff 0%, #b69865 50%, #00f0ff 100%);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.4), 0 20px 50px rgba(0,0,0,0.8);
        }
        .card-inner {
            width: 100%; height: 100%;
            background: #fff; border-radius: 10px;
            overflow: hidden; position: relative;
        }
        .card-inner img { width: 100%; height: 100%; object-fit: cover; }

        /* Medallón Número 1 */
        .medallion {
            position: absolute; top: 15px; right: 15px;
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--gold-light);
            border: 3px solid var(--gold-warm);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-weight: 900;
            color: #3d2f22; font-size: 24px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 5;
        }

        /* Emblema Cristal Inferior */
        .crystal-emblem {
            position: absolute; bottom: 15px; right: 15px;
            width: 45px; height: 45px;
            background: rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(5px);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            border: 2px solid var(--magic-cyan);
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
        }

        /* === BARRA INFERIOR: MADERA TALLADA === */
        .wood-dock {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            height: 85px;
            background-image: url('https://img.freepik.com/foto-gratis/fondo-textura-madera-marron-oscuro_53876-139660.jpg');
            background-size: cover;
            border-radius: 15px 15px 40px 40px;
            border: 3px solid var(--gold-warm);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.7), inset 0 5px 15px rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100;
        }
        .dock-item {
            display: flex; flex-direction: column; align-items: center;
            position: relative; text-decoration: none;
        }
        .dock-item i { font-size: 30px; color: var(--gold-light); filter: drop-shadow(0 0 5px rgba(0,0,0,0.5)); }
        
        /* Llama azul mágica */
        .magic-flame {
            position: absolute; top: -15px;
            width: 12px; height: 20px;
            background: var(--magic-cyan);
            border-radius: 50% 50% 20% 20%;
            filter: blur(2px);
            box-shadow: 0 0 10px var(--magic-cyan);
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes flicker {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.3); opacity: 1; }
        }

        /* Elemento lateral (Próxima tarjeta) */
        .side-peek {
            position: absolute; right: -220px; top: 50%; transform: translateY(-50%);
            width: 240px; height: 240px; border-radius: 20px;
            background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1);
            filter: blur(4px);
        }

    </style>
</head>
<body>

    <div class="temple-bg"></div>
    <div class="temple-glow"></div>

    <header class="game-header">
        <h1 class="game-title">Honor of Kings</h1>
        <p class="game-subtitle">
            Es el MOBA que más plata recauda en el mundo. Sus torneos millonarios lo hicieron imparable. ᛗ
        </p>
    </header>

    <div class="cta-container">
        <div class="parchment-banner">
            <div class="wax-seal">
                <i class="ri-cursor-fill"></i>
            </div>
            <p class="parchment-text">Hacé clic para saber más</p>
        </div>
    </div>

    <div style="position: relative; width: 100%;">
        <div class="card-frame">
            <div class="medallion">1</div>
            <div class="card-inner">
                <img src="https://fastcdn.hoyoverse.com/content-v2/plat/123439/c39dd0699f78411122c6c9797d57a592_7063500647883927830.jpeg" alt="Character Portrait">
            </div>
            <div class="crystal-emblem">
                <div style="width: 15px; height: 15px; background: white; clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);"></div>
            </div>
        </div>

        <div class="side-peek"></div>
    </div>

    <nav class="wood-dock">
        <a href="#" class="dock-item">
            <div class="magic-flame"></div>
            <i class="ri-home-fill" style="color: #ff9f43;"></i>
        </a>
        <a href="#" class="dock-item">
            <i class="ri-star-fill"></i>
        </a>
        <a href="#" class="dock-item">
            <i class="ri-tv-2-fill"></i>
        </a>
        <a href="#" class="dock-item">
            <i class="ri-chat-3-fill"></i>
        </a>
        <a href="#" class="dock-item">
            <i class="ri-user-fill"></i>
        </a>
    </nav>

</body>
</html>
