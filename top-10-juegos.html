<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 GDR</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&display=swap');

        /* === ESTILOS DEL CARGADOR (AÑADIDO) === */
        #loader {
            position: fixed;
            inset: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Por encima de todo */
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        #loader video {
            width: 100%;
            max-width: 500px;
            height: auto;
        }

        .loader-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* === TUS ESTILOS ORIGINALES === */
        :root{
            --accent:#00f0ff;
            --text-sub:rgba(255,255,255,.78);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter Tight',sans-serif;
        }

        body{
            background:#05070a;
            color:white;
            width:100vw;
            height:100vh;
            overflow:hidden;
            display:flex;
            flex-direction:column;
        }

        .bg-blur{
            position:fixed;
            inset:0;
            background-size:cover;
            background-position:center;
            transform:scale(1.12);
            filter: blur(7px) brightness(.68) saturate(1.35) contrast(1.08);
            z-index:-8;
            transition: background-image .45s ease, filter .45s ease;
        }

        .dark-layer{ position:fixed; inset:0; background: linear-gradient(to bottom, rgba(0,0,0,.15), rgba(0,0,0,.26), rgba(0,0,0,.38)); z-index:-7; }
        .top-fog{ position:fixed; top:-180px; left:-20%; width:140%; height:420px; background: radial-gradient(circle, rgba(0,255,255,.26) 0%, rgba(0,180,255,.13) 35%, rgba(0,0,0,0) 74%); filter:blur(70px); z-index:-6; pointer-events:none; }
        .bottom-fog{ position:fixed; bottom:-240px; left:-20%; width:140%; height:620px; background: radial-gradient(circle, rgba(0,255,255,.34) 0%, rgba(0,180,255,.15) 35%, rgba(0,0,0,0) 74%); filter:blur(90px); z-index:-6; pointer-events:none; }
        .edge-glow{ position:fixed; inset:0; pointer-events:none; z-index:-5; background: linear-gradient(to bottom, rgba(0,255,255,.42) 0%, rgba(0,220,255,.26) 10%, rgba(0,180,255,.13) 20%, rgba(0,120,255,.05) 32%, rgba(0,0,0,0) 46%), linear-gradient(to top, rgba(0,255,255,.45) 0%, rgba(0,220,255,.24) 10%, rgba(0,180,255,.12) 20%, rgba(0,120,255,.05) 32%, rgba(0,0,0,0) 46%); mix-blend-mode:screen; }
        .light-overlay{ position:fixed; inset:0; background: linear-gradient(135deg, rgba(255,255,255,.10), transparent 18%, transparent 82%, rgba(255,255,255,.05)); z-index:-4; }

        header{ padding:34px 25px 0; display:flex; gap:28px; z-index:10; }
        .nav-item{ font-size:13px; font-weight:700; text-decoration:none; color:rgba(255,255,255,.65); letter-spacing:.3px; text-transform:uppercase; }
        .nav-item.active{ color:white; border-bottom:3px solid var(--accent); padding-bottom:5px; }

        .hero{ padding:18px 25px; z-index:10; min-height:235px; }
        .hero h1{ font-family:'Inter Tight',sans-serif; font-size:64px; font-weight:800; line-height:.88; letter-spacing:-3px; text-transform:none; color:#ffffff; max-width:95%; transform:scaleX(.96); text-shadow: 0 2px 8px rgba(0,0,0,.30), 0 1px 2px rgba(0,0,0,.18); }
        .hero p{ font-family:'Inter Tight',sans-serif; margin-top:16px; font-size:17px; font-weight:500; line-height:1.22; letter-spacing:-0.4px; color:rgba(255,255,255,.90); max-width:94%; text-shadow: 0 2px 6px rgba(0,0,0,.45); }

        .slider-wrapper{ flex:1; display:flex; align-items:center; overflow-x:auto; scroll-snap-type:x mandatory; padding:0 18% 120px; scrollbar-width:none; margin-top:-5px; }
        .slider-wrapper::-webkit-scrollbar{ display:none; }
        .cards-container{ display:flex; align-items:center; gap:24px; }

        .card{ width:285px; height:285px; border-radius:30px; overflow:hidden; flex-shrink:0; scroll-snap-align:center; transition:all .38s ease; opacity:.34; transform:scale(.82); border:2px solid rgba(255,255,255,.06); position:relative; }
        .card img{ width:100%; height:100%; object-fit:cover; }
        .card.active{ opacity:1; transform:scale(1.1); border:5px solid var(--accent); box-shadow: 0 0 25px rgba(0,255,255,.65), 0 0 80px rgba(0,255,255,.22); }
        .badge{ position:absolute; top:12px; right:12px; width:52px; height:52px; border-radius:50%; background:white; color:black; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:900; z-index:5; }

        .dock{ position:fixed; left:18px; right:18px; bottom:24px; padding:16px 10px; display:flex; justify-content:space-around; border-radius:34px; background: linear-gradient(to bottom, rgba(20,25,35,.72), rgba(8,12,20,.82)); backdrop-filter:blur(26px); border:1px solid rgba(255,255,255,.08); box-shadow: 0 8px 30px rgba(0,0,0,.35); z-index:100; }
        .dock-btn{ font-size:34px; text-decoration:none; color:white; opacity:.42; transition:.25s; }
        .dock-btn.active{ opacity:1; filter: drop-shadow(0 0 10px var(--accent)); }
    </style>
</head>
<body>

<div id="loader">
    <video id="loaderVideo" autoplay muted playsinline>
        <source src="77218d9e-341c-4a58-a77c-aeb553f8083c.mp4~2.mp4" type="video/mp4">
    </video>
</div>

<div class="bg-blur" id="bgBlur"></div>
<div class="dark-layer"></div>
<div class="top-fog"></div>
<div class="bottom-fog"></div>
<div class="edge-glow"></div>
<div class="light-overlay"></div>

<header>
    <a href="index.html" class="nav-item active">LIBRARY</a>
    <a href="#" class="nav-item">ADD NEW</a>
    <a href="#" class="nav-item">SETTINGS</a>
</header>

<main class="hero">
    <h1 id="gameTitle">Top 10 más jugados</h1>
    <p id="gameDesc">TOP 10 Explorá los juegos más virales y con más jugadores de este mes en la plataforma.</p>
</main>

<div class="slider-wrapper" id="slider">
    <div class="cards-container">
        <div class="card active" data-title="Honor of Kings" data-desc="Es el MOBA que más plata recauda en el mundo. Sus torneos millonarios y su reciente salto global lo hicieron imparable." data-img="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">
            <div class="badge">1</div>
        </div>
        <div class="card" data-title="Among Us" data-desc="Sigue vivo porque corre hasta en una heladera. Es el juego social por excelencia para unir gente de PC y celu." data-img="https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Among_Us_cover_art.jpg/250px-Among_Us_cover_art.jpg">
            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Among_Us_cover_art.jpg/250px-Among_Us_cover_art.jpg">
            <div class="badge">2</div>
        </div>
        </div>
</div>

<nav class="dock">
    <a href="#" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

<script>
    /* --- LÓGICA DEL CARGADOR (AÑADIDO) --- */
    const loader = document.getElementById('loader');
    const loaderVideo = document.getElementById('loaderVideo');

    loaderVideo.onended = () => {
        loader.classList.add('loader-hidden');
    };

    setTimeout(() => {
        loader.classList.add('loader-hidden');
    }, 5000);

    /* --- LÓGICA DEL SLIDER ORIGINAL --- */
    const slider = document.getElementById('slider');
    const cards = document.querySelectorAll('.card');
    const bgBlur = document.getElementById('bgBlur');
    const gameTitle = document.getElementById('gameTitle');
    const gameDesc = document.getElementById('gameDesc');

    function updateActiveCard(){
        const sliderCenter = slider.scrollLeft + (slider.offsetWidth / 2);
        cards.forEach(card => {
            const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
            const distance = Math.abs(sliderCenter - cardCenter);
            if(distance < 160){
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                bgBlur.style.backgroundImage = `url('${card.dataset.img}')`;
                gameTitle.innerText = card.dataset.title;
                gameDesc.innerText = card.dataset.desc;
            }
        });
    }

    slider.addEventListener('scroll', updateActiveCard);

    window.onload = () => {
        if(cards.length > 0) {
            bgBlur.style.backgroundImage = `url('${cards[0].dataset.img}')`;
        }
        updateActiveCard();
    };
</script>
</body>
</html>
