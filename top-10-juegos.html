<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 más jugados - GDR</title>
    <style>
        :root {
            --accent: #00ffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #05070a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-blur {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.2);
            z-index: -1;
            transition: background-image 0.6s ease-in-out;
        }

        header { padding: 50px 30px 10px; display: flex; gap: 20px; z-index: 10; }
        .nav-item { font-size: 13px; font-weight: 900; color: var(--text-sub); text-decoration: none; text-transform: uppercase; position: relative; }
        .nav-item.active { color: white; }
        .nav-item.active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 3px; background: var(--accent); box-shadow: 0 0 15px var(--accent); }

        .hero { padding: 30px 30px 0; z-index: 10; min-height: 160px; }
        .hero h1 { font-size: 42px; font-weight: 900; line-height: 1; transition: all 0.3s; }
        .hero p { font-size: 14px; color: var(--text-sub); margin-top: 10px; max-width: 85%; line-height: 1.4; }
        .hero p b { color: white; }

        .slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            touch-action: pan-y;
        }

        .cards-container {
            display: flex;
            align-items: center;
            gap: 25px;
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
        }

        .card {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            overflow: hidden;
            opacity: 0.2;
            transition: all 0.5s ease;
            flex-shrink: 0;
            transform: scale(0.8);
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card.active {
            width: 280px;
            height: 280px;
            opacity: 1;
            border: 5px solid var(--accent);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            position: relative;
            transform: scale(1);
        }

        .badge {
            position: absolute;
            top: -12px; right: -12px;
            background: white; color: black;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 70px; background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(25px); border-radius: 35px;
            display: flex; justify-content: space-around; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dock-btn { font-size: 28px; opacity: 0.3; text-decoration: none; color: white; }
        .dock-btn.active { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <div class="bg-blur" id="bgBlur"></div>

    <header>
        <a href="#" class="nav-item active">LIBRARY</a>
        <a href="#" class="nav-item">ADD NEW</a>
    </header>

    <main class="hero">
        <h1 id="gameTitle">Top 10 más jugados</h1>
        <p id="gameDesc">Deslizá para ver el ranking.</p>
    </main>

    <div class="slider-wrapper" id="sliderWrapper">
        <div class="cards-container" id="cardsContainer">
            
            <div class="card" 
                 data-title="Roblox" 
                 data-desc="<b>TOP 10</b> Explorá los mundos creados por la comunidad. El juego con más variedad de la actualidad. [leer más]" 
                 data-img="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
                <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
                <div class="badge">10</div>
            </div>

            <div class="card" 
                 data-title="Minecraft" 
                 data-desc="<b>TOP 9</b> ¿Por qué está acá? El juego más vendido de la historia. Podés estar en la PC y jugar con alguien [leer más]" 
                 data-img="https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/key-art/Homepage_Discover-our-games_MC-Vanilla-KeyArt_864x864.jpg">
                <img src="https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/key-art/Homepage_Discover-our-games_MC-Vanilla-KeyArt_864x864.jpg">
                <div class="badge">9</div>
            </div>

        </div>
    </div>

    <nav class="dock">
        <a href="index.html" class="dock-btn active">🏠</a>
        <a href="#" class="dock-btn">⭐</a>
        <a href="#" class="dock-btn">📺</a>
        <a href="#" class="dock-btn">💬</a>
        <a href="#" class="dock-btn">👤</a>
    </nav>

    <script>
        const container = document.getElementById('cardsContainer');
        const cards = document.querySelectorAll('.card');
        const bgBlur = document.getElementById('bgBlur');
        const gameTitle = document.getElementById('gameTitle');
        const gameDesc = document.getElementById('gameDesc');
        
        let currentIndex = 0;
        let startX = 0;

        function updateSlider() {
            cards.forEach((card, i) => {
                card.classList.toggle('active', i === currentIndex);
            });
            
            // Cálculo para centrar el elemento activo
            const cardWidth = 100; 
            const gap = 25;
            const screenCenter = window.innerWidth / 2;
            const offset = screenCenter - (currentIndex * (cardWidth + gap)) - (280 / 2);
            
            container.style.transform = `translateX(${offset}px)`;
            
            // Actualizar contenido
            const activeCard = cards[currentIndex];
            bgBlur.style.backgroundImage = `url('${activeCard.getAttribute('data-img')}')`;
            gameTitle.innerText = activeCard.getAttribute('data-title');
            gameDesc.innerHTML = activeCard.getAttribute('data-desc');
        }

        container.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        container.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;

            if (diff > 50 && currentIndex < cards.length - 1) {
                currentIndex++;
            } else if (diff < -50 && currentIndex > 0) {
                currentIndex--;
            }
            updateSlider();
        });

        // Inicializar
        window.onload = updateSlider;
        // Ajustar si se rota la pantalla
        window.onresize = updateSlider;
    </script>
</body>
</html>
