<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Top 10 GDR - Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        :root {
            --accent: #facc15;
            --bg-dark: #090c13;
            --card-w: 280px;
            --card-h: 420px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); }
        
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            width: 100vw; height: 100vh;
            overflow: hidden; 
            display: flex; flex-direction: column;
        }

        /* FONDO DINÁMICO MEJORADO */
        .bg-blur {
            position: fixed; inset: 0; background-size: cover; background-position: center;
            filter: blur(50px) brightness(0.35); z-index: -10; transform: scale(1.3);
        }

        /* HEADER ESTILO MODERNO */
        header { 
            padding: 50px 30px 10px; 
            font-size: 11px; font-weight: 700; 
            letter-spacing: 2px; opacity: 0.5;
            text-transform: uppercase;
        }

        .hero { padding: 0 30px; margin-bottom: 20px; }
        .hero h1 { font-size: 40px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; }
        .hero p { font-size: 15px; color: rgba(255,255,255,0.6); margin-top: 8px; line-height: 1.4; }

        /* SLIDER RECONSTRUIDO */
        .slider-wrapper {
            flex: 1; display: flex; align-items: center;
            overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 0 12% 130px; 
            scrollbar-width: none;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .cards-container { display: flex; align-items: center; gap: 25px; }

        .card {
            width: var(--card-w); height: var(--card-h); 
            border-radius: 45px; /* Súper redondeado como la foto 2 */
            overflow: hidden; flex-shrink: 0; scroll-snap-align: center;
            opacity: 0.4; transform: scale(0.88);
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        
        .card.active {
            opacity: 1; transform: scale(1);
            box-shadow: 0 35px 70px -10px rgba(0, 0, 0, 0.9);
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* BADGE FLOTANTE */
        .badge {
            position: absolute; top: 25px; right: 25px;
            width: 45px; height: 45px; border-radius: 16px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* DOCK ESTILO CÁPSULA (Foto 2) */
        .dock {
            position: fixed; 
            bottom: 30px; left: 30px; right: 30px;
            height: 75px; border-radius: 38px;
            background: rgba(18, 22, 32, 0.8); 
            backdrop-filter: blur(25px);
            display: flex; justify-content: space-around; align-items: center;
            border: 1px solid rgba(255,255,255,0.08); z-index: 100;
        }
        .dock-btn { font-size: 26px; color: white; opacity: 0.3; text-decoration: none; }
        .dock-btn.active { opacity: 1; color: var(--accent); }

    </style>
</head>
<body>

    <div class="bg-blur" id="bgBlur"></div>

    <header>GDR Gaming • Top 10</header>

    <main class="hero">
        <h1 id="gameTitle">Cargando...</h1>
        <p id="gameDesc">Explora los juegos más épicos de la semana.</p>
    </main>

    <div class="slider-wrapper" id="slider">
        <div class="cards-container" id="cardsContainer"></div>
    </div>

    <nav class="dock">
        <a href="#" class="dock-btn active"><i class="ri-home-5-fill"></i></a>
        <a href="#" class="dock-btn"><i class="ri-compass-3-line"></i></a>
        <a href="#" class="dock-btn"><i class="ri-heart-3-line"></i></a>
        <a href="#" class="dock-btn"><i class="ri-user-6-line"></i></a>
    </nav>

    <script>
        // Mantenemos tus datos originales de la lista
        const games = [
            { id: 1, title: "Honor of Kings", desc: "El MOBA más jugado del mundo.", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10", link: "#" },
            { id: 2, title: "Among Us", desc: "Trabaja en equipo... o traiciona a todos.", img: "1778216047984~2.jpg", link: "among-us.html" },
            { id: 3, title: "Wild Rift", desc: "La experiencia de LoL en tu móvil.", img: "https://cloudfront-us-east-1.images.arcpublishing.com/infobae/CNTWUAMXZRF3BPIYPCNPFHOMJQ.jpg", link: "#" },
            { id: 4, title: "Warzone Mobile", desc: "Acción intensa de Battle Royale.", img: "https://i.blogs.es/954c69/cod6/840_560.jpeg", link: "#" },
            { id: 5, title: "Genshin Impact", desc: "Un mundo abierto lleno de magia.", img: "https://cdn2.unrealengine.com/genshin-impact-version-2-8-3840x2160-357d3d64d056.png", link: "#" },
            { id: 6, title: "PUBG Mobile", desc: "El Battle Royale original.", img: "https://m.media-amazon.com/images/M/MV5BODQzNzJjY2QtY2Y2YS00OWJmLTlkZWMtMmNmMmE2NTg1MjQzXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", link: "#" },
            { id: 7, title: "Fortnite", desc: "Construye y sobrevive.", img: "https://cms-assets.unrealengine.com/cm6l5gfpm05kr07my04cqgy2x/output=format:webp/cmhkq5qwo2mid07on940m6a7k", link: "#" },
            { id: 8, title: "Free Fire", desc: "Partidas rápidas y emocionantes.", img: "https://assets.propmark.com.br/uploads/2022/06/unnamed--99-.jpg", link: "#" },
            { id: 9, title: "Minecraft", desc: "Crea tu propio mundo infinito.", img: "https://artsyfartsy.eu/cdn/shop/files/17028.jpg?v=1760385248&width=320", link: "#" },
            { id: 10, title: "Roblox", desc: "Millones de mundos por descubrir.", img: "https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png", link: "#" }
        ];

        const container = document.getElementById('cardsContainer');
        const bgBlur = document.getElementById('bgBlur');
        const gameTitle = document.getElementById('gameTitle');
        const gameDesc = document.getElementById('gameDesc');
        const slider = document.getElementById('slider');

        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.title = g.title;
            card.dataset.desc = g.desc;
            card.dataset.img = g.img;
            card.dataset.link = g.link;
            card.innerHTML = `<img src="${g.img}"><div class="badge">${g.id}</div>`;
            container.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');

        function updateUI() {
            const center = slider.scrollLeft + (slider.offsetWidth / 2);
            cards.forEach(card => {
                const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
                if (Math.abs(center - cardCenter) < 150) {
                    cards.forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    bgBlur.style.backgroundImage = `url('${card.dataset.img}')`;
                    gameTitle.innerText = card.dataset.title;
                    gameDesc.innerText = card.dataset.desc;
                }
            });
        }

        container.addEventListener('click', (e) => {
            const card = e.target.closest('.card');
            if (card && card.classList.contains('active')) {
                const link = card.dataset.link;
                if (link !== "#") window.location.href = link;
            }
        });

        slider.addEventListener('scroll', updateUI);
        window.onload = updateUI;
    </script>
</body>
</html>
