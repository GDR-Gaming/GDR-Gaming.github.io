<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Top 10 GDR</title>

<style>

:root{
    --accent:#00ffff;
    --text-sub:rgba(255,255,255,0.68);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#05070a;
    color:white;
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* FONDO GAMING PREMIUM */
.bg-blur{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center;

    transform:scale(1.08);

    filter:
        blur(8px)
        brightness(0.72)
        saturate(1.4)
        contrast(1.15);

    opacity:1;

    z-index:-2;

    transition:
        background-image .45s ease,
        filter .45s ease;
}

/* OVERLAY PREMIUM */
.bg-overlay{
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at top,
            rgba(0,255,255,0.12),
            transparent 35%),

        radial-gradient(circle at bottom,
            rgba(0,255,255,0.16),
            transparent 45%),

        linear-gradient(
            to bottom,
            rgba(0,0,0,0.18),
            rgba(0,0,0,0.50)
        );

    backdrop-filter:blur(1px);

    z-index:-1;

    pointer-events:none;
}

header{
    padding:30px 25px 0;
    display:flex;
    gap:20px;
    z-index:10;
}

.nav-item{
    font-size:12px;
    font-weight:900;
    color:var(--text-sub);
    text-decoration:none;
    text-transform:uppercase;
}

.nav-item.active{
    color:white;
    border-bottom:2px solid var(--accent);
    padding-bottom:4px;
}

.hero{
    padding:10px 25px;
    z-index:10;
    height:140px;
    margin-top:5px;
}

.hero h1{
    font-size:42px;
    font-weight:900;
    line-height:0.95;

    text-shadow:
        0 4px 25px rgba(0,0,0,0.55);
}

.hero p{
    font-size:15px;
    color:var(--text-sub);
    margin-top:10px;
    line-height:1.35;
    max-width:95%;
}

/* SLIDER */
.slider-wrapper{
    flex:1;
    display:flex;
    align-items:center;
    overflow-x:auto;

    scroll-snap-type:x mandatory;

    padding:0 18% 120px;

    scrollbar-width:none;

    margin-top:-10px;
}

.slider-wrapper::-webkit-scrollbar{
    display:none;
}

.cards-container{
    display:flex;
    align-items:center;
    gap:22px;
}

/* CARDS */
.card{
    width:280px;
    height:280px;

    border-radius:28px;

    overflow:hidden;

    flex-shrink:0;

    scroll-snap-align:center;

    transition:all .38s ease;

    opacity:.38;

    transform:scale(.82);

    border:2px solid rgba(255,255,255,.08);

    position:relative;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CARD ACTIVA */
.card.active{
    opacity:1;

    transform:scale(1.1);

    border:5px solid var(--accent);

    box-shadow:
        0 0 25px rgba(0,255,255,.55),
        0 0 60px rgba(0,255,255,.20);
}

/* BADGE */
.badge{
    position:absolute;

    top:12px;
    right:12px;

    background:white;
    color:black;

    width:48px;
    height:48px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:24px;

    z-index:5;
}

/* DOCK */
.dock{
    position:fixed;

    bottom:22px;
    left:20px;
    right:20px;

    padding:15px 10px;

    display:flex;
    justify-content:space-around;

    background:rgba(10,15,25,.75);

    backdrop-filter:blur(25px);

    border-radius:30px;

    border:1px solid rgba(255,255,255,.08);

    z-index:100;
}

.dock-btn{
    font-size:32px;
    text-decoration:none;
    opacity:.45;
    color:white;

    transition:.25s;
}

.dock-btn.active{
    opacity:1;

    filter:
        drop-shadow(0 0 10px var(--accent));
}

</style>
</head>

<body>

<nav class="dock">
    <a href="#" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

<script>

const slider = document.getElementById('slider');

const cards = document.querySelectorAll('.card');

const bgBlur = document.getElementById('bgBlur');

const gameTitle = document.getElementById('gameTitle');

const gameDesc = document.getElementById('gameDesc');

function updateActiveCard(){

    const sliderCenter =
        slider.scrollLeft +
        (slider.offsetWidth / 2);

    cards.forEach(card => {

        const cardCenter =
            card.offsetLeft +
            (card.offsetWidth / 2);

        const distance =
            Math.abs(sliderCenter - cardCenter);

        if(distance < 160){

            cards.forEach(c =>
                c.classList.remove('active')
            );

            card.classList.add('active');

            bgBlur.style.backgroundImage =
                `url('${card.dataset.img}')`;

            gameTitle.innerText =
                card.dataset.title;

            gameDesc.innerText =
                card.dataset.desc;
        }
    });
}

slider.addEventListener('scroll', updateActiveCard);

window.onload = () => {

    bgBlur.style.backgroundImage =
        `url('${cards[0].dataset.img}')`;

    updateActiveCard();
};

</script>
