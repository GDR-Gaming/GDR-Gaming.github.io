<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 más jugados - GDR</title>
    <style>
        :root {
            --accent: #00ffff;
            --text-sub: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #05070a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* FONDO DIFUMINADO DINÁMICO */
        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png');
            background-size: cover;
            background-position: center;
            filter: blur(50px) brightness(0.3);
            z-index: -1;
            transform: scale(1.2);
        }

        /* NAVEGACIÓN SUPERIOR (MÁS CHICA) */
        header {
            display: flex;
            gap: 20px;
            padding: 25px 20px 10px;
        }

        .nav-item {
            font-size: 11px;
            font-weight: 900;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            position: relative;
        }

        .nav-item.active {
            color: white;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        /* TÍTULO Y DESCRIPCIÓN (AJUSTADOS) */
        .hero {
            padding: 20px 20px;
        }

        .hero h1 {
            font-size: 42px; /* Reducido para que no ocupe toda la pantalla */
            font-weight: 900;
            margin-bottom: 8px;
            line-height: 1;
        }

        .hero p {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.4;
            max-width: 85%;
        }

        .hero p b { color: white; }

        /* CARRUSEL DE JUEGOS (POSICIÓN CENTRAL) */
        .game-carousel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .card {
            width: 85px;
            height: 85px;
            border-radius: 15px;
            overflow: hidden;
            opacity: 0.3;
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* EL CUADRADO CENTRAL GRANDE */
        .card.active {
            width: 145px;
            height: 145px;
            opacity: 1;
            border: 3px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            position: relative;
        }

        .notif {
            position: absolute;
            top: -10px;
            right: -10px;
            background: white;
            color: black;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
        }

        /* DOCK INFERIOR (MÁS ALTO PARA QUE SE VEA) */
        .dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .dock-btn { font-size: 22px; opacity: 0.5; text-decoration: none; color: white; }
        .dock-btn.active { opacity: 1; color: var(--accent); }

    </style>
</head>
<body>

<div class="bg-blur"></div>

<header>
    <a href="#" class="nav-item active">LIBRARY</a>
    <a href="#" class="nav-item">ADD NEW</a>
    <a href="#" class="nav-item">SETTINGS</a>
</header>

<main class="hero">
    <h1>Top 10 más jugados</h1>
    <p><b>TOP 10</b> Explorá los juegos más virales y con más jugadores de este mes en la plataforma. [LEER MAS]</p>
</main>

<div class="game-carousel">
    <div class="card">
        <img src="https://i.pinimg.com/736x/0a/7b/7e/0a7b7e8d1a2b3c4d5e6f7g8h9i0j1k2l.jpg" alt="Prev">
    </div>

    <div class="card active">
        <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png" alt="Roblox">
        <div class="notif">1</div>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/61m1-v2B8vL._AC_UF894,1000_QL80_.jpg" alt="Next">
    </div>
</div>

<nav class="dock">
    <a href="index.html" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">★</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

</body>
</html>
