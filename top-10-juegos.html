<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 más jugados - GDR</title>
    <style>
        :root {
            --accent: #00ffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #05070a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png');
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.25);
            z-index: -1;
            transform: scale(1.2);
        }

        header {
            padding: 50px 30px 10px;
            display: flex;
            gap: 20px;
        }

        .nav-item {
            font-size: 13px;
            font-weight: 900;
            color: var(--text-sub);
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
        }

        .nav-item.active {
            color: white;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .hero {
            padding: 30px 30px 0;
        }

        .hero h1 {
            font-size: 58px;
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: -2px;
        }

        .hero p {
            font-size: 16px;
            color: var(--text-sub);
            line-height: 1.3;
            max-width: 85%;
        }

        /* EL TRUCO PARA EL CENTRADO REAL */
        .main-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Esto lo sube al medio del espacio sobrante */
            align-items: center;
            padding-bottom: 50px; /* Margen para no chocar con el dock */
        }

        .carousel {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .card-side {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            opacity: 0.2;
            overflow: hidden;
        }

        .card-side img { width: 100%; height: 100%; object-fit: cover; }

        .card-main {
            width: 280px; /* TAMAÑO MÁXIMO */
            height: 280px;
            border-radius: 35px;
            border: 5px solid var(--accent);
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.4);
            position: relative;
        }

        .card-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 30px;
        }

        .badge {
            position: absolute;
            top: -15px;
            right: -15px;
            background: white;
            color: black;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 22px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 75px;
            background: rgba(20, 25, 40, 0.8);
            backdrop-filter: blur(30px);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dock-btn { font-size: 32px; opacity: 0.3; text-decoration: none; color: white; }
        .dock-btn.active { opacity: 1; color: var(--accent); }

    </style>
</head>
<body>

<div class="bg-blur"></div>

<header>
    <a href="#" class="nav-item active">LIBRARY</a>
    <a href="#" class="nav-item">ADD NEW</a>
    <a href="#" class="nav-item">SETTINGS</a>
</header>

<main class="hero">
    <h1>Top 10 más jugados</h1>
    <p><b>TOP 10</b> Explorá los juegos más virales y con más jugadores de este mes. [LEER MAS]</p>
</main>

<div class="main-view">
    <div class="carousel">
        <div class="card-side"><img src="https://m.media-amazon.com/images/I/61m1-v2B8vL._AC_UF894,1000_QL80_.jpg"></div>
        
        <div class="card-main">
            <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
            <div class="badge">1</div>
        </div>

        <div class="card-side"><img src="https://i.pinimg.com/736x/8e/1e/8a/8e1e8a2a0a2f1c3a7a9a1a1a1a1a1a1a.jpg"></div>
    </div>
</div>

<nav class="dock">
    <a href="index.html" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

</body>
</html>
