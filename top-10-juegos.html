<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 Juegos - GDR</title>
    <style>
        :root { --bg-deep: #080a10; --text-main: #ffffff; --text-sub: #b0b3c0; --accent: #00ffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-deep); color: var(--text-main); font-family: sans-serif; width: 100vw; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .app-wallpaper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; filter: blur(15px) brightness(0.3); z-index: 1; }
        .app-container { width: 100%; height: 100%; position: relative; z-index: 2; display: flex; flex-direction: column; padding: 20px 16px; }
        .top-nav { display: flex; justify-content: center; gap: 25px; padding-top: 10px; }
        .nav-item { font-size: 13px; text-transform: uppercase; color: var(--text-sub); position: relative; }
        .nav-item.active { color: var(--accent); }
        .hero-section { margin-top: 50px; flex-grow: 1; display: flex; flex-direction: column; }
        .hero-title { font-size: 40px; font-weight: 900; line-height: 1; margin-bottom: 15px; }
        .hero-description { font-size: 14px; color: var(--text-sub); line-height: 1.6; margin-bottom: 30px; }
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: auto; margin-bottom: 60px; }
        .game-poster { aspect-ratio: 1/1; background-color: #1a1a1a; border-radius: 12px; overflow: hidden; position: relative; }
        .game-poster img { width: 100%; height: 100%; object-fit: cover; }
        .game-poster.active { border: 2px solid var(--accent); box-shadow: 0 0 15px rgba(0,255,255,0.4); }
        .dock-bar { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 85%; height: 60px; background-color: rgba(26,26,26,0.9); border-radius: 30px; display: flex; justify-content: space-around; align-items: center; }
        .back-btn { position: absolute; top: 20px; left: 16px; color: var(--accent); text-decoration: none; font-size: 20px; }
    </style>
</head>
<body>
    <div class="app-wallpaper"></div>
    <div class="app-container">
        <a href="index.html" class="back-btn">←</a>
        <header>
            <nav class="top-nav">
                <span class="nav-item active">LIBRARY</span>
                <span class="nav-item">ADD NEW</span>
            </nav>
        </header>
        <main class="hero-section">
            <h1 class="hero-title">Roblox Top 10</h1>
            <p class="hero-description">
                <span style="font-weight: 700; color: #fff;">TOP 10</span> 
                Explorá los juegos más virales y con más jugadores de este mes en la plataforma. [LEER MAS]
            </p>
            <div class="game-grid">
                <div class="game-poster active"><img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png"></div>
                <div class="game-poster"><img src="https://i0.wp.com/www.gamerfocus.co/wp-content/uploads/2021/04/bloxfruits.jpg"></div>
                <div class="game-poster"><img src="https://media.vandal.net/m/11-2023/2023111311105315_1.jpg"></div>
            </div>
        </main>
        <footer class="dock-bar">
            <span style="font-size:24px">🏠</span>
            <span style="font-size:24px; color:#555">🖥️</span>
            <span style="font-size:24px; color:#555">👤</span>
        </footer>
    </div>
</body>
</html>
