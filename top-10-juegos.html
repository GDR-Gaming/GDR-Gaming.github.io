<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 más jugados - GDR</title>
    <style>
        :root {
            --accent: #00ffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #05070a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png');
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.2);
            z-index: -1;
            transform: scale(1.2);
        }

        header {
            padding: 50px 30px 10px;
            display: flex;
            gap: 20px;
        }

        .nav-item {
            font-size: 13px;
            font-weight: 900;
            color: var(--text-sub);
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
        }

        .nav-item.active { color: white; }
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .hero { padding: 30px 30px 0; }
        .hero h1 {
            font-size: 55px;
            font-weight: 900;
            letter-spacing: -2px;
            line-height: 1;
        }
        .hero p {
            font-size: 15px;
            color: var(--text-sub);
            margin-top: 10px;
            max-width: 80%;
        }

        /* EL CUADRADO CENTRADO A LA FUERZA */
        .center-focus {
            position: absolute;
            top: 55%; /* Lo baja un poco del encabezado pero queda bien arriba del dock */
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-side {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            opacity: 0.15;
            overflow: hidden;
        }

        .card-main {
            width: 300px; /* Tamaño máximo para tu pantalla */
            height: 300px;
            border-radius: 40px;
            border: 6px solid var(--accent);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.5);
            position: relative;
        }

        .card-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 34px;
        }

        .badge {
            position: absolute;
            top: -15px;
            right: -15px;
            background: white;
            color: black;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            z-index: 20;
        }

        .dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            height: 75px;
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(30px);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dock-btn { font-size: 32px; opacity: 0.3; text-decoration: none; color: white; }
        .dock-btn.active { opacity: 1; color: var(--accent); }

    </style>
</head>
<body>

<div class="bg-blur"></div>

<header>
    <a href="#" class="nav-item active">LIBRARY</a>
    <a href="#" class="nav-item">ADD NEW</a>
</header>

<main class="hero">
    <h1>Top 10 más jugados</h1>
    <p><b>TOP 10</b> Los títulos que están rompiendo récords este mes en la plataforma.</p>
</main>

<div class="center-focus">
    <div class="card-side"><img src="https://i.pinimg.com/736x/8e/1e/8a/8e1e8a2a0a2f1c3a7a9a1a1a1a1a1a1a.jpg"></div>
    
    <div class="card-main">
        <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
        <div class="badge">1</div>
    </div>

    <div class="card-side"><img src="https://m.media-amazon.com/images/I/61m1-v2B8vL._AC_UF894,1000_QL80_.jpg"></div>
</div>

<nav class="dock">
    <a href="index.html" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

</body>
</html>
