<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 más jugados - GDR</title>
    <style>
        :root {
            --accent: #00ffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #05070a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* FONDO BLUR */
        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png');
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.3);
            z-index: -1;
            transform: scale(1.2);
        }

        /* HEADER */
        header {
            display: flex;
            gap: 25px;
            padding: 40px 30px 10px;
        }

        .nav-item {
            font-size: 13px;
            font-weight: 900;
            color: var(--text-sub);
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
        }

        .nav-item.active {
            color: white;
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        /* TEXTOS */
        .hero {
            padding: 40px 30px;
        }

        .hero h1 {
            font-size: 55px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .hero p {
            font-size: 16px;
            color: var(--text-sub);
            line-height: 1.4;
            max-width: 90%;
        }

        /* SELECTOR CENTRAL - AQUÍ ESTÁ EL CAMBIO */
        .selector-container {
            flex: 1;
            display: flex;
            align-items: center; /* Centrado vertical */
            justify-content: center; /* Centrado horizontal */
            padding-bottom: 100px; /* Espacio para que no lo tape el dock */
        }

        .carousel {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .card-side {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            overflow: hidden;
            opacity: 0.3;
        }

        .card-side img { width: 100%; height: 100%; object-fit: cover; }

        .card-main {
            width: 220px; /* MUCHO MÁS GRANDE */
            height: 220px;
            border-radius: 30px;
            border: 4px solid var(--accent);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            position: relative;
            z-index: 10;
        }

        .card-main img { width: 100%; height: 100%; object-fit: cover; border-radius: 26px; }

        .badge {
            position: absolute;
            top: -12px;
            right: -12px;
            background: white;
            color: black;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* DOCK */
        .dock {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dock-btn { font-size: 28px; opacity: 0.4; text-decoration: none; }
        .dock-btn.active { opacity: 1; filter: drop-shadow(0 0 8px var(--accent)); }

    </style>
</head>
<body>

<div class="bg-blur"></div>

<header>
    <a href="#" class="nav-item active">LIBRARY</a>
    <a href="#" class="nav-item">ADD NEW</a>
    <a href="#" class="nav-item">SETTINGS</a>
</header>

<main class="hero">
    <h1>Top 10 más jugados</h1>
    <p><b>TOP 10</b> Explorá los juegos más virales y con más jugadores de este mes en la plataforma. [LEER MAS]</p>
</main>

<div class="selector-container">
    <div class="carousel">
        <div class="card-side">
            <img src="https://i.pinimg.com/736x/8e/1e/8a/8e1e8a2a0a2f1c3a7a9a1a1a1a1a1a1a.jpg">
        </div>

        <div class="card-main">
            <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
            <div class="badge">1</div>
        </div>

        <div class="card-side">
            <img src="https://m.media-amazon.com/images/I/61m1-v2B8vL._AC_UF894,1000_QL80_.jpg">
        </div>
    </div>
</div>

<nav class="dock">
    <a href="index.html" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

</body>
</html>
