<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 más jugados - GDR</title>
    <style>
        :root {
            --bg-deep: #05060a;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
            --accent: #00ffff;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* FONDO DIFUMINADO */
        .background-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://w0.peakpx.com/wallpaper/434/960/wallpaper-honor-of-kings-moba-games.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.35);
            z-index: -1;
            transform: scale(1.1);
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* NAVEGACIÓN SUPERIOR */
        header {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 50px;
        }

        .nav-link {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-sub);
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .nav-link.active {
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 4px;
        }

        /* SECCIÓN PRINCIPAL */
        .hero h1 {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-sub);
            margin-bottom: 30px;
        }

        .hero p b { color: #fff; }

        /* GRILLA DE JUEGOS */
        .poster-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: auto;
            margin-bottom: 80px;
        }

        .poster {
            aspect-ratio: 1/1;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            position: relative;
        }

        .poster img { width: 100%; height: 100%; object-fit: cover; }

        .poster.active {
            border: 2.5px solid #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            transform: scale(1.05);
        }

        .notif {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            color: #000;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        /* DOCK INFERIOR */
        .dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 60px;
            background: rgba(20, 20, 30, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid var(--glass-border);
        }

        .dock-item { font-size: 22px; opacity: 0.5; color: white; text-decoration: none; }
        .dock-item.active { opacity: 1; color: var(--accent); }

        .back-btn {
            position: absolute;
            top: 25px;
            left: 20px;
            color: white;
            text-decoration: none;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="background-wrapper"></div>

    <div class="container">
        <a href="index.html" class="back-btn">←</a>

        <header>
            <a href="#" class="nav-link active">LIBRARY</a>
            <a href="#" class="nav-link">ADD NEW</a>
            <a href="#" class="nav-link">SETTINGS</a>
        </header>

        <main class="hero">
            <h1>Top 10 más jugados</h1>
            <p>
                <b>TOP 10</b> Explorá los juegos que están dominando el mundo gamer este mes. 
                Títulos que rompen récords de audiencia y recaudación.
            </p>

            <div class="poster-grid">
                <div class="poster active">
                    <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
                    <div class="notif">1</div>
                </div>
                <div class="poster">
                    <img src="https://i0.wp.com/www.gamerfocus.co/wp-content/uploads/2021/04/bloxfruits.jpg">
                </div>
                <div class="poster">
                    <img src="https://media.vandal.net/m/11-2023/2023111311105315_1.jpg">
                </div>
            </div>
        </main>

        <nav class="dock">
            <a href="index.html" class="dock-item active">🏠</a>
            <a href="#" class="dock-item">🔖</a>
            <a href="#" class="dock-item">📺</a>
            <a href="#" class="dock-item">💬</a>
            <a href="#" class="dock-item">👤</a>
        </nav>
    </div>

</body>
</html>
