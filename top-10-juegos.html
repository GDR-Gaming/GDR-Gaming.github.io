<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 GDR</title>
    <style>
        :root { --accent: #00ffff; --text-sub: rgba(255, 255, 255, 0.6); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #05070a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* AJUSTE: FONDO MENOS BORROSO Y MÁS NÍTIDO */
        .bg-blur {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            
            /* Bajamos de 120px a 25px para que se note la foto */
            filter: blur(25px) brightness(0.35); 
            
            z-index: -1;
            transition: background-image 0.6s ease-in-out;
            transform: scale(1.1);
        }

        /* Capa extra para que el texto siempre sea legible sobre la foto */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, rgba(5, 7, 10, 0.8) 100%);
            z-index: -1;
        }

        header { padding: 30px 25px 0; display: flex; gap: 20px; z-index: 10; }
        .nav-item { font-size: 11px; font-weight: 900; color: var(--text-sub); text-decoration: none; text-transform: uppercase; }
        .nav-item.active { color: white; border-bottom: 2px solid var(--accent); padding-bottom: 3px; }

        .hero { padding: 10px 25px; z-index: 10; height: 130px; margin-top: 5px; }
        .hero h1 { font-size: 36px; font-weight: 900; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .hero p { font-size: 13px; color: var(--text-sub); margin-top: 5px; line-height: 1.3; }

        .slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 0 15% 120px; 
            scrollbar-width: none;
            margin-top: -20px;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }

        .cards-container { display: flex; align-items: center; gap: 20px; }

        .card {
            width: 280px; 
            height: 280px;
            border-radius: 25px;
            overflow: hidden;
            flex-shrink: 0;
            scroll-snap-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0.4;
            transform: scale(0.8);
            border: 2px solid rgba(255,255,255,0.1);
            position: relative;
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card.active {
            opacity: 1;
            transform: scale(1.1);
            border: 5px solid var(--accent);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
        }

        .badge {
            position: absolute; top: 12px; right: 12px;
            background: white; color: black;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .dock {
            position: fixed;
            bottom: 25px; 
            left: 20px;
            right: 20px;
            padding: 15px 10px; 
            display: flex; 
            justify-content: space-around;
            background: rgba(15, 20, 30, 0.85); 
            backdrop-filter: blur(20px);
            border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }
        .dock-btn { font-size: 32px; text-decoration: none; opacity: 0.4; color: white; }
        .dock-btn.active { opacity: 1; filter: drop-shadow(0 0 8px var(--accent)); }
    </style>
</head>
<body>

<div class="bg-blur" id="bgBlur"></div>
<div class="bg-overlay"></div>

<header>
    <a href="#" class="nav-item active">LIBRARY</a>
    <a href="#" class="nav-item">ADD NEW</a>
</header>

<main class="hero">
    <h1 id="gameTitle">Cargando...</h1>
    <p id="gameDesc">Navegá el ranking.</p>
</main>

<div class="slider-wrapper" id="slider">
    <div class="cards-container">
        <div class="card" data-title="Honor of Kings" data-desc="¿Por qué está acá? Es el MOBA que más plata recauda en el mundo. Sus torneos millonarios lo hicieron imparable. [leer más]" data-img="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">
            <div class="badge">1</div>
        </div>
        <div class="card" data-title="Minecraft" data-desc="¿Por qué está acá? El más vendido de la historia. Jugá con cualquiera. [leer más]" data-img="https://artsyfartsy.eu/cdn/shop/files/17028.jpg?v=1760385248&width=320">
            <img src="https://artsyfartsy.eu/cdn/shop/files/17028.jpg?v=1760385248&width=320">
            <div class="badge">9</div>
        </div>
        <div class="card" data-title="Roblox" data-desc="Mundos creados por la comunidad. La mayor variedad de la actualidad. [leer más]" data-img="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
            <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
            <div class="badge">10</div>
        </div>
    </div>
</div>

<nav class="dock">
    <a href="index.html" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

<script>
    const slider = document.getElementById('slider');
    const cards = document.querySelectorAll('.card');
    const bgBlur = document.getElementById('bgBlur');
    const gameTitle = document.getElementById('gameTitle');
    const gameDesc = document.getElementById('gameDesc');

    const updateActiveCard = () => {
        const sliderCenter = slider.scrollLeft + (slider.offsetWidth / 2);
        cards.forEach(card => {
            const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
            const distance = Math.abs(sliderCenter - cardCenter);
            if (distance < 140) { 
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                bgBlur.style.backgroundImage = `url('${card.dataset.img}')`;
                gameTitle.innerText = card.dataset.title;
                gameDesc.innerHTML = card.dataset.desc;
            }
        });
    };
    slider.addEventListener('scroll', updateActiveCard);
    window.onload = () => { slider.scrollLeft = 0; updateActiveCard(); };
</script>

</body>
</html>
