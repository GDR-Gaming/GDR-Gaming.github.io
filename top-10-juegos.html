<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 más jugados - GDR</title>
    <style>
        :root {
            --accent: #00ffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #05070a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-blur {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.2);
            z-index: -1;
            transition: background-image 0.6s ease-in-out;
        }

        header { padding: 40px 25px 5px; display: flex; gap: 20px; z-index: 10; }
        .nav-item { font-size: 13px; font-weight: 900; color: var(--text-sub); text-decoration: none; text-transform: uppercase; position: relative; }
        .nav-item.active { color: white; }
        .nav-item.active::after { content: ''; position: absolute; bottom: -8px; left: 0; width: 100%; height: 3px; background: var(--accent); box-shadow: 0 0 15px var(--accent); }

        .hero { padding: 25px 25px 0; z-index: 10; min-height: 140px; }
        .hero h1 { font-size: 44px; font-weight: 900; line-height: 1; margin-bottom: 8px; }
        .hero p { font-size: 15px; color: var(--text-sub); line-height: 1.3; max-width: 90%; }

        /* AJUSTE PARA QUE NO SE CORTE */
        .slider-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            overflow: visible; 
            position: relative;
            touch-action: pan-y;
            width: 100%;
        }

        .cards-container {
            display: flex;
            align-items: center;
            gap: 40px; 
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            will-change: transform;
            padding: 0 50px; /* Espacio extra a los lados */
        }

        .card {
            width: 120px; 
            height: 120px;
            border-radius: 25px;
            overflow: hidden;
            opacity: 0.25;
            transition: all 0.5s ease;
            flex-shrink: 0;
            transform: scale(0.8);
            position: relative;
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* TAMAÑO DEL CUADRO CENTRADO */
        .card.active {
            width: 290px; 
            height: 290px;
            opacity: 1;
            border: 5px solid var(--accent);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4);
            transform: scale(1);
        }

        .badge {
            position: absolute;
            top: -10px; right: -10px;
            background: white; color: black;
            width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 22px;
            z-index: 5;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .dock {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 75px; background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(30px); border-radius: 40px;
            display: flex; justify-content: space-around; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .dock-btn { font-size: 30px; opacity: 0.3; text-decoration: none; color: white; }
        .dock-btn.active { opacity: 1; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <a href="#" class="nav-item active">LIBRARY</a>
        <a href="#" class="nav-item">ADD NEW</a>

    <main class="hero">

            <div class="card" data-title="Roblox" data-desc="<b>TOP 10</b> Explorá los mundos creados por la comunidad. El juego con más variedad de la actualidad. [leer más]" data-img="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">
                <img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">

                <img src="https://assets.propmark.com.br/uploads/2022/06/unnamed--99-.jpg">

        </div>
    </div>

    <nav class="dock">
        <a href="index.html" class="dock-btn active">🏠</a>
        <a href="#" class="dock-btn">⭐</a>
        <a href="#" class="dock-btn">📺</a>
        <a href="#" class="dock-btn">💬</a>
        <a href="#" class="dock-btn">👤</a>
    </nav>

    <script>
        const container = document.getElementById('cardsContainer');
        const cards = document.querySelectorAll('.card');
        const bgBlur = document.getElementById('bgBlur');
        const gameTitle = document.getElementById('gameTitle');
        const gameDesc = document.getElementById('gameDesc');
        
        let currentIndex = 0;
        let startX = 0;

        function updateSlider() {
            cards.forEach((card, i) => {
                card.classList.toggle('active', i === currentIndex);
            });
            
            // LÓGICA DE CENTRADO CORREGIDA
            const screenWidth = window.innerWidth;
            const cardWidth = 120; 
            const activeCardWidth = 290;
            const gap = 40;
            
            // Calculamos cuánto se debe mover para que la carta activa esté en el centro exacto
            const offset = (screenWidth / 2) - (currentIndex * (cardWidth + gap)) - (activeCardWidth / 2);
            
            container.style.transform = `translateX(${offset}px)`;
            
            const activeCard = cards[currentIndex];
            bgBlur.style.backgroundImage = `url('${activeCard.getAttribute('data-img')}')`;
            gameTitle.innerText = activeCard.getAttribute('data-title');
            gameDesc.innerHTML = activeCard.getAttribute('data-desc');
        }

        container.addEventListener('touchstart', (e) => startX = e.touches[0].clientX);
        container.addEventListener('touchend', (e) => {
            const endX = e.changedTouches[0].clientX;
            const diff = startX - endX;
            if (diff > 45 && currentIndex < cards.length - 1) currentIndex++;
            else if (diff < -45 && currentIndex > 0) currentIndex--;
            updateSlider();
        });

        window.onload = updateSlider;
        window.onresize = updateSlider;
    </script>
</body>
</html>
