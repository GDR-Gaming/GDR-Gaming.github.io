<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Top 10 GDR</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');

:root{
    --accent:#00f0ff;
    --text-sub:rgba(255,255,255,.78);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#05070a;
    color:white;
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* ========================= */
/* FONDO */
/* ========================= */

.bg-blur{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center;

    transform:scale(1.08);

    filter:
        blur(5px)
        brightness(.70)
        saturate(1.3)
        contrast(1.12);

    z-index:-5;

    transition:
        background-image .45s ease,
        filter .45s ease;
}

/* OSCURECE CENTRO */
.dark-layer{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.18),
            rgba(0,0,0,.30),
            rgba(0,0,0,.45)
        );

    z-index:-4;
}

/* NIEBLA SUPERIOR */
.top-fog{
    position:fixed;

    top:-140px;
    left:-25%;

    width:150%;
    height:430px;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.24) 0%,
            rgba(0,180,255,.12) 35%,
            rgba(0,0,0,0) 72%
        );

    filter:blur(55px);

    z-index:-3;

    pointer-events:none;
}

/* NIEBLA INFERIOR */
.bottom-fog{
    position:fixed;

    bottom:-200px;
    left:-25%;

    width:150%;
    height:560px;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.28) 0%,
            rgba(0,180,255,.14) 35%,
            rgba(0,0,0,0) 72%
        );

    filter:blur(80px);

    z-index:-3;

    pointer-events:none;
}

/* BRILLO GENERAL */
.light-overlay{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            130deg,
            rgba(255,255,255,.10),
            transparent 18%,
            transparent 82%,
            rgba(255,255,255,.05)
        );

    z-index:-2;

    pointer-events:none;
}

/* ========================= */
/* NUEVO DEGRADADO CELESTE */
/* ========================= */

.edge-glow{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-1;

    background:

    /* SUPERIOR */
    linear-gradient(
        to bottom,

        rgba(0,255,255,.36) 0%,

        rgba(0,220,255,.24) 10%,

        rgba(0,180,255,.13) 20%,

        rgba(0,120,255,.06) 30%,

        rgba(0,0,0,0) 44%
    ),

    /* INFERIOR */
    linear-gradient(
        to top,

        rgba(0,255,255,.38) 0%,

        rgba(0,220,255,.24) 10%,

        rgba(0,180,255,.13) 20%,

        rgba(0,120,255,.06) 30%,

        rgba(0,0,0,0) 44%
    );

    mix-blend-mode:screen;

    opacity:.95;
}

/* ========================= */
/* HEADER */
/* ========================= */

header{
    padding:38px 25px 0;
    display:flex;
    gap:28px;
    z-index:10;
}

.nav-item{
    font-size:13px;
    font-weight:700;
    color:rgba(255,255,255,.65);
    text-decoration:none;
    text-transform:uppercase;
    letter-spacing:.3px;
}

.nav-item.active{
    color:white;
    border-bottom:3px solid var(--accent);
    padding-bottom:6px;
}

/* ========================= */
/* HERO */
/* ========================= */

.hero{
    padding:18px 25px;
    z-index:10;
    min-height:220px;
}

.hero h1{
    font-size:64px;
    font-weight:900;
    line-height:.92;
    letter-spacing:-2.5px;
    max-width:95%;

    text-shadow:
        0 6px 20px rgba(0,0,0,.55);
}

.hero p{
    margin-top:16px;

    font-size:16px;

    line-height:1.45;

    font-weight:500;

    color:rgba(255,255,255,.88);

    max-width:94%;

    text-shadow:
        0 3px 10px rgba(0,0,0,.65);
}

/* ========================= */
/* SLIDER */
/* ========================= */

.slider-wrapper{
    flex:1;

    display:flex;
    align-items:center;

    overflow-x:auto;

    scroll-snap-type:x mandatory;

    padding:0 18% 120px;

    scrollbar-width:none;

    margin-top:-10px;
}

.slider-wrapper::-webkit-scrollbar{
    display:none;
}

.cards-container{
    display:flex;
    align-items:center;
    gap:24px;
}

/* ========================= */
/* CARDS */
/* ========================= */

.card{
    width:285px;
    height:285px;

    border-radius:30px;

    overflow:hidden;

    flex-shrink:0;

    scroll-snap-align:center;

    transition:all .38s ease;

    opacity:.34;

    transform:scale(.82);

    border:2px solid rgba(255,255,255,.06);

    position:relative;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card.active{
    opacity:1;

    transform:scale(1.1);

    border:5px solid var(--accent);

    box-shadow:
        0 0 25px rgba(0,255,255,.65),
        0 0 80px rgba(0,255,255,.24);
}

/* ========================= */
/* BADGE */
/* ========================= */

.badge{
    position:absolute;

    top:12px;
    right:12px;

    width:52px;
    height:52px;

    border-radius:50%;

    background:white;

    color:black;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;
    font-weight:900;

    z-index:5;
}

/* ========================= */
/* DOCK */
/* ========================= */

.dock{
    position:fixed;

    left:18px;
    right:18px;
    bottom:24px;

    padding:16px 10px;

    display:flex;
    justify-content:space-around;

    border-radius:34px;

    background:
        linear-gradient(
            to bottom,
            rgba(20,25,35,.72),
            rgba(8,12,20,.82)
        );

    backdrop-filter:blur(26px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);

    z-index:100;
}

.dock-btn{
    font-size:34px;

    text-decoration:none;

    color:white;

    opacity:.42;

    transition:.25s;
}

.dock-btn.active{
    opacity:1;

    filter:
        drop-shadow(0 0 10px var(--accent));
}

</style>
</head>

<body>

<div class="dark-layer"></div>

<div class="bottom-fog"></div>

<div class="edge-glow"></div>

<main class="hero">

<div class="slider-wrapper" id="slider">

<div class="cards-container">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">

</div>

<div class="card"

data-img="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">

<img src="https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png">

</div>

<nav class="dock">
    <a href="#" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

<script>

const slider = document.getElementById('slider');

const cards = document.querySelectorAll('.card');

const bgBlur = document.getElementById('bgBlur');

const gameTitle = document.getElementById('gameTitle');

const gameDesc = document.getElementById('gameDesc');

function updateActiveCard(){

    const sliderCenter =
        slider.scrollLeft +
        (slider.offsetWidth / 2);

    cards.forEach(card => {

        const cardCenter =
            card.offsetLeft +
            (card.offsetWidth / 2);

        const distance =
            Math.abs(sliderCenter - cardCenter);

        if(distance < 160){

            cards.forEach(c =>
                c.classList.remove('active')
            );

            card.classList.add('active');

            bgBlur.style.backgroundImage =
                `url('${card.dataset.img}')`;

            gameTitle.innerText =
                card.dataset.title;

            gameDesc.innerText =
                card.dataset.desc;
        }
    });
}

slider.addEventListener('scroll', updateActiveCard);

window.onload = () => {

    bgBlur.style.backgroundImage =
        `url('${cards[0].dataset.img}')`;

    updateActiveCard();
};

</script>

</body>
</html>
