<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 GDR - Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        /* === FUENTES Y VARIABLES === */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter+Tight:wght@400;700;800&display=swap');

        :root {
            --accent: #00f0ff;
            --hk-gold: #b69865;
            --hk-scroll: #f5e9d2;
            --bg-dark: #05070a;
            --main-font: 'Inter Tight', sans-serif;
        }

        /* === RESET Y BASE === */
        * { margin: 0; padding: 0; box-sizing: border-box; transition: all 0.4s ease; }
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: var(--main-font);
            width: 100vw; height: 100vh;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* === FONDO Y EFECTOS === */
        .bg-blur {
            position: fixed; inset: 0; background-size: cover; background-position: center;
            filter: blur(8px) brightness(0.5); z-index: -10; transform: scale(1.1);
        }

        .edge-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: -5;
            background: linear-gradient(to bottom, var(--accent) 0%, transparent 40%),
                        linear-gradient(to top, var(--accent) 0%, transparent 40%);
            mix-blend-mode: screen; opacity: 0.2;
        }

        /* === TEMAS DINÁMICOS === */
        /* Estilo para Honor of Kings (Templo) */
        body.theme-honor { 
            --accent: #ffd700; 
            font-family: 'Playfair Display', serif;
        }
        body.theme-honor .edge-glow { opacity: 0.4; background: radial-gradient(circle at center, rgba(0,240,255,0.2), transparent); }
        body.theme-honor #gameTitle { font-family: 'Cinzel', serif; color: #e6dcc6; }

        /* Estilo Estándar (Moderna) */
        body.theme-default { --accent: #00f0ff; }

        /* === CONTENIDO === */
        header { padding: 30px 25px; z-index: 10; font-size: 12px; font-weight: 800; letter-spacing: 1px; }
        .hero { padding: 0 25px; z-index: 10; min-height: 200px; }
        .hero h1 { font-size: 50px; font-weight: 800; line-height: 1; margin-bottom: 10px; }
        .hero p { font-size: 15px; color: rgba(255,255,255,0.8); max-width: 90%; line-height: 1.3; }

        /* === SLIDER === */
        .slider-wrapper {
            flex: 1; display: flex; align-items: center;
            overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 0 15% 100px; scrollbar-width: none;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .cards-container { display: flex; align-items: center; gap: 20px; }

        .card {
            width: 260px; height: 260px; border-radius: 25px;
            overflow: hidden; flex-shrink: 0; scroll-snap-align: center;
            opacity: 0.3; transform: scale(0.8);
            border: 2px solid rgba(255,255,255,0.1); position: relative;
        }
        .card.active {
            opacity: 1; transform: scale(1.1);
            border: 4px solid var(--accent);
            box-shadow: 0 0 30px var(--accent);
        }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        /* Badge de número */
        .badge {
            position: absolute; top: 12px; right: 12px;
            width: 45px; height: 45px; border-radius: 50%;
            background: white; color: black;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 20px;
        }

        /* Elementos exclusivos HoK */
        .hok-only { display: none; }
        body.theme-honor .hok-only { display: block; }

        .hk-scroll-block {
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
            background: var(--hk-scroll); color: #5c4a37;
            padding: 8px 15px; border-radius: 8px; font-size: 11px; font-weight: 800;
            border: 2px solid var(--hk-gold); width: 180px; text-align: center;
        }

        /* === DOCK === */
        .dock {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            height: 70px; border-radius: 25px;
            background: rgba(15,20,30,0.8); backdrop-filter: blur(15px);
            display: flex; justify-content: space-around; align-items: center;
            border: 1px solid rgba(255,255,255,0.1); z-index: 100;
        }
        .dock-btn { font-size: 24px; color: white; opacity: 0.4; text-decoration: none; }
        .dock-btn.active { opacity: 1; filter: drop-shadow(0 0 8px var(--accent)); }

    </style>
</head>
<body class="theme-honor">

    <div class="bg-blur" id="bgBlur"></div>
    <div class="edge-glow"></div>

    <header>LIBRARY</header>

    <main class="hero">
        <h1 id="gameTitle">Cargando...</h1>
        <p id="gameDesc">Explora los juegos más virales del mes.</p>
    </main>

    <div class="slider-wrapper" id="slider">
        <div class="cards-container" id="cardsContainer">
            </div>
    </div>

    <nav class="dock">
        <a href="#" class="dock-btn active"><i class="ri-home-5-fill"></i></a>
        <a href="#" class="dock-btn"><i class="ri-star-fill"></i></a>
        <a href="#" class="dock-btn"><i class="ri-tv-2-fill"></i></a>
        <a href="#" class="dock-btn"><i class="ri-user-fill"></i></a>
    </nav>

    <script>
        const games = [
            { id: 1, theme: 'honor', title: "Honor of Kings", desc: "¿Por qué está acá? Es el MOBA que más plata recauda en el mundo. Sus torneos millonarios lo hicieron imparable.", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10" },
            { id: 2, theme: 'default', title: "Among Us", desc: "¿Por qué está acá? Sigue vivo porque corre hasta en una heladera. Es el juego social por excelencia.", img: "https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Among_Us_cover_art.jpg/250px-Among_Us_cover_art.jpg" },
            { id: 3, theme: 'default', title: "Wild Rift", desc: "La versión móvil de LoL. Riot domina los móviles con la experiencia más pulida del género.", img: "https://cloudfront-us-east-1.images.arcpublishing.com/infobae/CNTWUAMXZRF3BPIYPCNPFHOMJQ.jpg" },
            { id: 4, theme: 'default', title: "Warzone Mobile", desc: "Todo lo que haces en PC se guarda en tu celu. La experiencia de guerra definitiva en 2026.", img: "https://i.blogs.es/954c69/cod6/840_560.jpeg" },
            { id: 5, theme: 'default', title: "Genshin Impact", desc: "Fue el primero en meter un juego de consola en un celular. Visualmente es una bestia.", img: "https://cdn2.unrealengine.com/genshin-impact-version-2-8-3840x2160-357d3d64d056.png" },
            { id: 6, theme: 'default', title: "PUBG Mobile", desc: "El padre del género Battle Royale. Su comunidad es gigantesca y táctica.", img: "https://m.media-amazon.com/images/M/MV5BODQzNzJjY2QtY2Y2YS00OWJmLTlkZWMtMmNmMmE2NTg1MjQzXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" },
            { id: 7, theme: 'default', title: "Fortnite", desc: "Ya es más una red social que un juego. Conciertos, LEGO y diversión infinita.", img: "https://cms-assets.unrealengine.com/cm6l5gfpm05kr07my04cqgy2x/output=format:webp/cmhkq5qwo2mid07on940m6a7k" },
            { id: 8, theme: 'default', title: "Free Fire", desc: "El rey de la gama baja. Domina porque todos tus amigos lo pueden jugar.", img: "https://assets.propmark.com.br/uploads/2022/06/unnamed--99-.jpg" },
            { id: 9, theme: 'default', title: "Minecraft", desc: "El más vendido de la historia. Juega con cualquiera desde cualquier plataforma.", img: "https://artsyfartsy.eu/cdn/shop/files/17028.jpg?v=1760385248&width=320" },
            { id: 10, theme: 'default', title: "Roblox 👑", desc: "No es un juego, son millones de juegos en uno. Podés jugar, crear y ganar plata.", img: "https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png" }
        ];

        const container = document.getElementById('cardsContainer');
        const bgBlur = document.getElementById('bgBlur');
        const gameTitle = document.getElementById('gameTitle');
        const gameDesc = document.getElementById('gameDesc');
        const slider = document.getElementById('slider');

        // Generar Tarjetas
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.theme = g.theme;
            card.dataset.title = g.title;
            card.dataset.desc = g.desc;
            card.dataset.img = g.img;
            
            card.innerHTML = `
                ${g.id === 1 ? '<div class="hk-scroll-block hok-only">Hacé clic para saber más</div>' : ''}
                <img src="${g.img}">
                <div class="badge">${g.id}</div>
            `;
            container.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');

        function updateUI() {
            const center = slider.scrollLeft + (slider.offsetWidth / 2);
            cards.forEach(card => {
                const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
                if (Math.abs(center - cardCenter) < 130) {
                    cards.forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    
                    bgBlur.style.backgroundImage = `url('${card.dataset.img}')`;
                    gameTitle.innerText = card.dataset.title;
                    gameDesc.innerText = card.dataset.desc;

                    // Cambiar Tema
                    document.body.className = 'theme-' + card.dataset.theme;
                }
            });
        }

        slider.addEventListener('scroll', updateUI);
        window.onload = updateUI;
    </script>
</body>
</html>
