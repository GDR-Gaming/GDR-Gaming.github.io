<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Top 10 GDR</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&display=swap');

:root{
    --accent:#00f0ff;
    --text-sub:rgba(255,255,255,.78);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter Tight',sans-serif;
}

body{
    background:#05070a;
    color:white;
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* ========================= */
/* FONDO */
/* ========================= */

.bg-blur{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center;

    transform:scale(1.12);

    filter:
        blur(7px)
        brightness(.68)
        saturate(1.35)
        contrast(1.08);

    z-index:-8;

    transition:
        background-image .45s ease,
        filter .45s ease;
}

/* OSCURECE LEVEMENTE */
.dark-layer{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.15),
            rgba(0,0,0,.26),
            rgba(0,0,0,.38)
        );

    z-index:-7;
}

/* BRILLO SUPERIOR */
.top-fog{
    position:fixed;

    top:-180px;
    left:-20%;

    width:140%;
    height:420px;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.26) 0%,
            rgba(0,180,255,.13) 35%,
            rgba(0,0,0,0) 74%
        );

    filter:blur(70px);

    z-index:-6;

    pointer-events:none;
}

/* BRILLO INFERIOR */
.bottom-fog{
    position:fixed;

    bottom:-240px;
    left:-20%;

    width:140%;
    height:620px;

    background:
        radial-gradient(
            circle,
            rgba(0,255,255,.34) 0%,
            rgba(0,180,255,.15) 35%,
            rgba(0,0,0,0) 74%
        );

    filter:blur(90px);

    z-index:-6;

    pointer-events:none;
}

/* NIEBLA CELESTE ARRIBA Y ABAJO */
.edge-glow{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:-5;

    background:

    linear-gradient(
        to bottom,

        rgba(0,255,255,.42) 0%,

        rgba(0,220,255,.26) 10%,

        rgba(0,180,255,.13) 20%,

        rgba(0,120,255,.05) 32%,

        rgba(0,0,0,0) 46%
    ),

    linear-gradient(
        to top,

        rgba(0,255,255,.45) 0%,

        rgba(0,220,255,.24) 10%,

        rgba(0,180,255,.12) 20%,

        rgba(0,120,255,.05) 32%,

        rgba(0,0,0,0) 46%
    );

    mix-blend-mode:screen;
}

/* BRILLO DE VIDRIO */
.light-overlay{
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.10),
            transparent 18%,
            transparent 82%,
            rgba(255,255,255,.05)
        );

    z-index:-4;
}

/* ========================= */
/* HEADER */
/* ========================= */

header{
    padding:34px 25px 0;

    display:flex;

    gap:28px;

    z-index:10;
}

.nav-item{
    font-size:13px;

    font-weight:700;

    text-decoration:none;

    color:rgba(255,255,255,.65);

    letter-spacing:.3px;

    text-transform:uppercase;
}

.nav-item.active{
    color:white;

    border-bottom:3px solid var(--accent);

    padding-bottom:5px;
}

/* ========================= */
/* HERO */
/* ========================= */

.hero{
    padding:18px 25px;

    z-index:10;

    min-height:235px;
}

/* TITULO NUEVO */

.hero h1{

    font-family:'Inter Tight',sans-serif;

    font-size:64px;

    font-weight:800;

    line-height:.88;

    letter-spacing:-3px;

    text-transform:none;

    color:#ffffff;

    max-width:95%;

    transform:scaleX(.96);

    text-shadow:
        0 2px 8px rgba(0,0,0,.30),
        0 1px 2px rgba(0,0,0,.18);
}

/* DESCRIPCION NUEVA */

.hero p{

    font-family:'Inter Tight',sans-serif;

    margin-top:16px;

    font-size:17px;

    font-weight:500;

    line-height:1.22;

    letter-spacing:-0.4px;

    color:rgba(255,255,255,.90);

    max-width:94%;

    text-shadow:
        0 2px 6px rgba(0,0,0,.45);
}

/* ========================= */
/* SLIDER */
/* ========================= */

.slider-wrapper{
    flex:1;

    display:flex;

    align-items:center;

    overflow-x:auto;

    scroll-snap-type:x mandatory;

    padding:0 18% 120px;

    scrollbar-width:none;

    margin-top:-5px;
}

.slider-wrapper::-webkit-scrollbar{
    display:none;
}

.cards-container{
    display:flex;

    align-items:center;

    gap:24px;
}

/* ========================= */
/* CARDS */
/* ========================= */

.card{
    width:285px;

    height:285px;

    border-radius:30px;

    overflow:hidden;

    flex-shrink:0;

    scroll-snap-align:center;

    transition:all .38s ease;

    opacity:.34;

    transform:scale(.82);

    border:2px solid rgba(255,255,255,.06);

    position:relative;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card.active{
    opacity:1;

    transform:scale(1.1);

    border:5px solid var(--accent);

    box-shadow:
        0 0 25px rgba(0,255,255,.65),
        0 0 80px rgba(0,255,255,.22);
}

/* ========================= */
/* BADGE */
/* ========================= */

.badge{
    position:absolute;

    top:12px;
    right:12px;

    width:52px;
    height:52px;

    border-radius:50%;

    background:white;

    color:black;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    font-weight:900;

    z-index:5;
}

/* ========================= */
/* DOCK */
/* ========================= */

.dock{
    position:fixed;

    left:18px;
    right:18px;
    bottom:24px;

    padding:16px 10px;

    display:flex;
    justify-content:space-around;

    border-radius:34px;

    background:
        linear-gradient(
            to bottom,
            rgba(20,25,35,.72),
            rgba(8,12,20,.82)
        );

    backdrop-filter:blur(26px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);

    z-index:100;
}

.dock-btn{
    font-size:34px;

    text-decoration:none;

    color:white;

    opacity:.42;

    transition:.25s;
}

.dock-btn.active{
    opacity:1;

    filter:
        drop-shadow(0 0 10px var(--accent));
}

</style>
</head>

<script>

const slider =
document.getElementById('slider');

const cards =
document.querySelectorAll('.card');

const bgBlur =
document.getElementById('bgBlur');

const gameTitle =
document.getElementById('gameTitle');

const gameDesc =
document.getElementById('gameDesc');

function updateActiveCard(){

    const sliderCenter =
        slider.scrollLeft +
        (slider.offsetWidth / 2);

    cards.forEach(card => {

        const cardCenter =
            card.offsetLeft +
            (card.offsetWidth / 2);

        const distance =
            Math.abs(sliderCenter - cardCenter);

        if(distance < 160){

            cards.forEach(c =>
                c.classList.remove('active')
            );

            card.classList.add('active');

            bgBlur.style.backgroundImage =
                `url('${card.dataset.img}')`;

            gameTitle.innerText =
                card.dataset.title;

            gameDesc.innerText =
                card.dataset.desc;
        }
    });
}

slider.addEventListener(
'scroll',
updateActiveCard
);

window.onload = () => {

    bgBlur.style.backgroundImage =
    `url('${cards[0].dataset.img}')`;

    updateActiveCard();
};

</script>
