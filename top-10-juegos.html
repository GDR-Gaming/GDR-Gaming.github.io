<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GDR Gaming - Home Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        :root {
            --accent: #ffffff;
            --bg-dark: #0a0d14;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        /* RESET Y BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            width: 100vw; height: 100vh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        .bg-blur {
            position: fixed; inset: 0; background-size: cover; background-position: center;
            filter: blur(60px) brightness(0.25); z-index: -10; transform: scale(1.5);
            transition: background-image 0.8s ease-in-out;
        }

        /* 1. BARRA SUPERIOR (HEADER) */
        .top-nav {
            padding: 50px 25px 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        .top-nav h2 { font-size: 22px; font-weight: 700; }

        /* 2. BUSCADOR */
        .search-container { padding: 0 25px 20px; }
        .search-bar {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 14px 20px;
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: blur(10px);
        }
        .search-bar span { opacity: 0.4; font-size: 15px; }

        /* 3. CATEGORÍAS */
        .categories {
            display: flex; gap: 25px; padding: 0 25px 25px;
            overflow-x: auto; scrollbar-width: none;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-item { font-size: 15px; font-weight: 600; opacity: 0.4; white-space: nowrap; position: relative; }
        .cat-item.active { opacity: 1; }
        .cat-item.active::after {
            content: ''; position: absolute; bottom: -8px; left: 50%;
            transform: translateX(-50%); width: 5px; height: 5px;
            background: white; border-radius: 50%;
        }

        /* 4. SLIDER DE CARTAS */
        .slider-wrapper {
            flex: 1; display: flex; align-items: center;
            overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 0 10% 120px; scrollbar-width: none;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .cards-container { display: flex; align-items: center; gap: 20px; }

        .card {
            width: 290px; height: 430px; 
            border-radius: 50px; overflow: hidden;
            flex-shrink: 0; scroll-snap-align: center;
            opacity: 0.4; transform: scale(0.85);
            position: relative; transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .card.active { opacity: 1; transform: scale(1); cursor: pointer; }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card-info { position: absolute; bottom: 30px; left: 30px; z-index: 5; }
        .card-info h3 { font-size: 24px; font-weight: 800; }
        .card-info p { font-size: 14px; opacity: 0.6; }

        .badge-num {
            position: absolute; top: 25px; left: 25px;
            background: rgba(255,255,255,0.2); backdrop-filter: blur(10px);
            padding: 5px 15px; border-radius: 12px; font-weight: 800;
        }

        /* 5. DOCK INFERIOR */
        .dock {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 90px; background: rgba(10, 13, 20, 0.95);
            backdrop-filter: blur(30px);
            display: flex; justify-content: space-around; align-items: center;
            padding: 0 15px 25px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .dock-btn { font-size: 24px; color: white; opacity: 0.3; text-decoration: none; display: flex; flex-direction: column; align-items: center; }
        .dock-btn.active { opacity: 1; }
        .add-btn { width: 60px; height: 60px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: black; font-size: 30px; transform: translateY(-30px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }

    </style>
</head>
<body>

    <div class="bg-blur" id="bgBlur"></div>

    <nav class="top-nav">
        <i class="ri-menu-2-line"></i>
        <h2>Home</h2>
        <i class="ri-notification-3-line"></i>
    </nav>

    <div class="search-container">
        <div class="search-bar">
            <i class="ri-search-line"></i>
            <span>Search your Games</span>
        </div>
    </div>

    <div class="categories">
        <div class="cat-item active">Action</div>
        <div class="cat-item">Survival</div>
        <div class="cat-item">Adventure</div>
        <div class="cat-item">MOBA</div>
        <div class="cat-item">Shooter</div>
    </div>

    <div class="slider-wrapper" id="slider">
        <div class="cards-container" id="cardsContainer"></div>
    </div>

    <nav class="dock">
        <a href="#" class="dock-btn active"><i class="ri-home-5-fill"></i></a>
        <a href="#" class="dock-btn"><i class="ri-gamepad-line"></i></a>
        <div class="add-btn"><i class="ri-add-line"></i></div>
        <a href="#" class="dock-btn"><i class="ri-mail-line"></i></a>
        <a href="#" class="dock-btn"><i class="ri-user-line"></i></a>
    </nav>

    <script>
        const games = [
            { id: 1, title: "Honor of Kings", tag: "MOBA 5v5", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10", link: "#" },
            { id: 2, title: "Among Us", tag: "Deducción Social", img: "1778216047984~2.jpg", link: "among-us.html" },
            { id: 3, title: "Wild Rift", tag: "League of Legends", img: "https://cloudfront-us-east-1.images.arcpublishing.com/infobae/CNTWUAMXZRF3BPIYPCNPFHOMJQ.jpg", link: "#" },
            { id: 4, title: "Warzone Mobile", tag: "FPS Battle Royale", img: "https://i.blogs.es/954c69/cod6/840_560.jpeg", link: "#" },
            { id: 5, title: "Genshin Impact", tag: "RPG Mundo Abierto", img: "https://cdn2.unrealengine.com/genshin-impact-version-2-8-3840x2160-357d3d64d056.png", link: "#" },
            { id: 6, title: "PUBG Mobile", tag: "Survivor Royale", img: "https://m.media-amazon.com/images/M/MV5BODQzNzJjY2QtY2Y2YS00OWJmLTlkZWMtMmNmMmE2NTg1MjQzXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg", link: "#" },
            { id: 7, title: "Fortnite", tag: "Construcción y Acción", img: "https://cms-assets.unrealengine.com/cm6l5gfpm05kr07my04cqgy2x/output=format:webp/cmhkq5qwo2mid07on940m6a7k", link: "#" },
            { id: 8, title: "Free Fire", tag: "Battle Royale Rápido", img: "https://assets.propmark.com.br/uploads/2022/06/unnamed--99-.jpg", link: "#" },
            { id: 9, title: "Minecraft", tag: "Construcción Infinita", img: "https://artsyfartsy.eu/cdn/shop/files/17028.jpg?v=1760385248&width=320", link: "#" },
            { id: 10, title: "Roblox", tag: "Metaverso de Juegos", img: "https://www.pantallasamigas.net/wp-content/uploads/2020/08/Roblox-videojuego-para-jugar-en-familia.png", link: "#" }
        ];

        const container = document.getElementById('cardsContainer');
        const bgBlur = document.getElementById('bgBlur');
        const slider = document.getElementById('slider');

        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.link = g.link;
            card.innerHTML = `
                <div class="badge-num">#${g.id}</div>
                <img src="${g.img}">
                <div class="card-info">
                    <h3>${g.title}</h3>
                    <p>${g.tag}</p>
                </div>
            `;
            container.appendChild(card);
        });

        const cards = document.querySelectorAll('.card');

        function updateUI() {
            const center = slider.scrollLeft + (slider.offsetWidth / 2);
            cards.forEach(card => {
                const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
                if (Math.abs(center - cardCenter) < 150) {
                    cards.forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    bgBlur.style.backgroundImage = `url('${card.querySelector('img').src}')`;
                }
            });
        }

        container.addEventListener('click', (e) => {
            const card = e.target.closest('.card');
            if (card && card.classList.contains('active')) {
                const link = card.dataset.link;
                if (link !== "#") window.location.href = link;
            }
        });

        slider.addEventListener('scroll', updateUI);
        window.onload = updateUI;
    </script>
</body>
</html>
