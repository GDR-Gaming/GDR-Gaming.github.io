<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Top 10 GDR - Tematizado</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&family=Cinzel:wght@700&display=swap');

        /* === VARIABLES DINÁMICAS === */
        :root {
            --accent: #00f0ff;
            --text-sub: rgba(255,255,255,.78);
            --main-font: 'Inter Tight', sans-serif;
            --card-border: rgba(255,255,255,.06);
            --card-shadow: rgba(0,255,255,.65);
        }

        /* --- TEMA HONOR (FANTASY) --- */
        body.theme-honor {
            --accent: #ffd700; /* Dorado */
            --main-font: 'Cinzel', serif;
            --card-border: #ffd700;
            --card-shadow: rgba(255, 215, 0, 0.5);
        }

        /* --- TEMA AMONG (SPACE) --- */
        body.theme-among {
            --accent: #00ffcc; /* Neón Espacial */
            --main-font: 'Inter Tight', sans-serif;
            --card-border: #00ffcc;
            --card-shadow: rgba(0, 255, 204, 0.7);
        }

        /* === ESTILOS GENERALES === */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: var(--main-font);
            transition: all 0.5s ease; /* Transición suave para el cambio de tema */
        }

        body {
            background: #05070a; color: white;
            width: 100vw; height: 100vh;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* FONDO Y NIEBLA */
        .bg-blur {
            position: fixed; inset: 0; background-size: cover; background-position: center;
            transform: scale(1.12); filter: blur(7px) brightness(.5); z-index: -8;
        }

        .edge-glow {
            position: fixed; inset: 0; pointer-events: none; z-index: -5;
            background: linear-gradient(to bottom, var(--accent) 0%, transparent 40%),
                        linear-gradient(to top, var(--accent) 0%, transparent 40%);
            mix-blend-mode: screen; opacity: 0.3;
        }

        /* HERO SECTION */
        .hero { padding: 18px 25px; z-index: 10; min-height: 235px; }
        .hero h1 {
            font-size: 58px; font-weight: 800; line-height: .9;
            letter-spacing: -2px; color: #ffffff;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hero p {
            margin-top: 12px; font-size: 16px; font-weight: 500;
            color: rgba(255,255,255,.9); max-width: 90%;
        }

        /* SLIDER Y CARDS */
        .slider-wrapper {
            flex: 1; display: flex; align-items: center;
            overflow-x: auto; scroll-snap-type: x mandatory;
            padding: 0 18% 120px; scrollbar-width: none;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        .cards-container { display: flex; align-items: center; gap: 24px; }

        .card {
            width: 280px; height: 280px; border-radius: 30px;
            overflow: hidden; flex-shrink: 0; scroll-snap-align: center;
            opacity: .34; transform: scale(.8);
            border: 2px solid var(--card-border); position: relative;
        }

        .card.active {
            opacity: 1; transform: scale(1.1);
            border: 4px solid var(--accent);
            box-shadow: 0 0 30px var(--card-shadow);
        }

        .card img { width: 100%; height: 100%; object-fit: cover; }

        .badge {
            position: absolute; top: 12px; right: 12px;
            width: 45px; height: 45px; border-radius: 50%;
            background: white; color: black;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900;
        }

        /* DOCK */
        .dock {
            position: fixed; bottom: 24px; left: 18px; right: 18px;
            padding: 15px; display: flex; justify-content: space-around;
            border-radius: 30px; background: rgba(10,15,25,0.8);
            backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
        }

        .dock-btn { font-size: 28px; text-decoration: none; opacity: 0.4; }
        .dock-btn.active { 
            opacity: 1; 
            filter: drop-shadow(0 0 8px var(--accent)); 
        }

    </style>
</head>
<body class="theme-honor"> <div class="bg-blur" id="bgBlur"></div>
    <div class="edge-glow"></div>

    <header style="padding: 30px 25px; display: flex; gap: 20px; z-index: 10;">
        <a href="#" class="nav-item" style="color: white; text-decoration: none; font-weight: 700; font-size: 12px;">LIBRARY</a>
        <a href="#" class="nav-item" style="opacity: 0.5; color: white; text-decoration: none; font-size: 12px;">SETTINGS</a>
    </header>

    <main class="hero">
        <h1 id="gameTitle">Honor of Kings</h1>
        <p id="gameDesc">Cargando descripción...</p>
    </main>

    <div class="slider-wrapper" id="slider">
        <div class="cards-container">
            
            <div class="card active" 
                 data-theme="honor"
                 data-title="Honor of Kings" 
                 data-desc="¿Por qué está acá? Es el MOBA que más plata recauda en el mundo. Sus torneos millonarios lo hicieron imparable."
                 data-img="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">
                <div class="badge">1</div>
            </div>

            <div class="card" 
                 data-theme="among"
                 data-title="Among Us" 
                 data-desc="¿Por qué está acá? Sigue vivo porque corre hasta en una heladera. Es el juego social por excelencia para unir gente."
                 data-img="https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Among_Us_cover_art.jpg/250px-Among_Us_cover_art.jpg">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Among_Us_cover_art.jpg/250px-Among_Us_cover_art.jpg">
                <div class="badge">2</div>
            </div>

            <div class="card" 
                 data-theme="among"
                 data-title="League of Legends" 
                 data-desc="Es la cara de los Esports. Riot domina la PC con el original y el móvil con Wild Rift."
                 data-img="https://cloudfront-us-east-1.images.arcpublishing.com/infobae/CNTWUAMXZRF3BPIYPCNPFHOMJQ.jpg">
                <img src="https://cloudfront-us-east-1.images.arcpublishing.com/infobae/CNTWUAMXZRF3BPIYPCNPFHOMJQ.jpg">
                <div class="badge">3</div>
            </div>

        </div>
    </div>

    <nav class="dock">
        <a href="#" class="dock-btn active">🏠</a>
        <a href="#" class="dock-btn">⭐</a>
        <a href="#" class="dock-btn">📺</a>
        <a href="#" class="dock-btn">👤</a>
    </nav>

    <script>
        const slider = document.getElementById('slider');
        const cards = document.querySelectorAll('.card');
        const bgBlur = document.getElementById('bgBlur');
        const gameTitle = document.getElementById('gameTitle');
        const gameDesc = document.getElementById('gameDesc');
        const body = document.body;

        function updateActiveCard(){
            const sliderCenter = slider.scrollLeft + (slider.offsetWidth / 2);

            cards.forEach(card => {
                const cardCenter = card.offsetLeft + (card.offsetWidth / 2);
                const distance = Math.abs(sliderCenter - cardCenter);

                if(distance < 150){
                    // Quitar activo de todos
                    cards.forEach(c => c.classList.remove('active'));
                    
                    // Activar actual
                    card.classList.add('active');

                    // Cambiar Contenido
                    bgBlur.style.backgroundImage = `url('${card.dataset.img}')`;
                    gameTitle.innerText = card.dataset.title;
                    gameDesc.innerText = card.dataset.desc;

                    // CAMBIO DE TEMA MÁGICO ✨
                    const theme = card.dataset.theme;
                    body.className = ''; // Limpiar clases
                    body.classList.add('theme-' + theme); 
                }
            });
        }

        slider.addEventListener('scroll', updateActiveCard);

        // Inicialización
        window.onload = () => {
            bgBlur.style.backgroundImage = `url('${cards[0].dataset.img}')`;
            updateActiveCard();
        };
    </script>
</body>
</html>
