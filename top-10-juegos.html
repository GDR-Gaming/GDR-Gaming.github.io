<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Top 10 GDR</title>

<style>

:root{
    --accent:#00ffff;
    --text-sub:rgba(255,255,255,0.6);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#05070a;
    color:white;
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

/* FONDO PREMIUM */
.bg-blur{
    position:fixed;
    inset:0;

    background-size:cover;
    background-position:center;

    transform:scale(1.15);

    filter:
        blur(14px)
        brightness(0.55)
        saturate(1.3)
        contrast(1.1);

    opacity:0.95;

    z-index:-2;

    transition:
        background-image .5s ease,
        filter .5s ease;
}

/* OVERLAY PREMIUM */
.bg-overlay{
    position:fixed;
    inset:0;

    background:
        radial-gradient(circle at top,
            rgba(0,255,255,0.10),
            transparent 40%),

        radial-gradient(circle at bottom,
            rgba(0,255,255,0.15),
            transparent 45%),

        linear-gradient(
            to bottom,
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.55)
        );

    backdrop-filter:blur(2px);

    z-index:-1;

    pointer-events:none;
}

header{
    padding:30px 25px 0;
    display:flex;
    gap:20px;
    z-index:10;
}

.nav-item{
    font-size:11px;
    font-weight:900;
    color:var(--text-sub);
    text-decoration:none;
    text-transform:uppercase;
}

.nav-item.active{
    color:white;
    border-bottom:2px solid var(--accent);
    padding-bottom:3px;
}

.hero{
    padding:10px 25px;
    z-index:10;
    height:130px;
    margin-top:5px;
}

.hero h1{
    font-size:36px;
    font-weight:900;
    line-height:1;
    text-shadow:0 4px 20px rgba(0,0,0,0.5);
}

.hero p{
    font-size:13px;
    color:var(--text-sub);
    margin-top:5px;
    line-height:1.3;
    max-width:90%;
}

.slider-wrapper{
    flex:1;
    display:flex;
    align-items:center;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:0 15% 120px;
    scrollbar-width:none;
    margin-top:-20px;
}

.slider-wrapper::-webkit-scrollbar{
    display:none;
}

.cards-container{
    display:flex;
    align-items:center;
    gap:20px;
}

.card{
    width:280px;
    height:280px;

    border-radius:25px;
    overflow:hidden;

    flex-shrink:0;

    scroll-snap-align:center;

    transition:all .4s ease;

    opacity:.35;

    transform:scale(.82);

    border:2px solid rgba(255,255,255,.08);

    position:relative;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card.active{
    opacity:1;

    transform:scale(1.1);

    border:5px solid var(--accent);

    box-shadow:
        0 0 40px rgba(0,255,255,.5),
        0 0 80px rgba(0,255,255,.15);
}

.badge{
    position:absolute;
    top:10px;
    right:10px;

    background:white;
    color:black;

    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:22px;

    z-index:5;
}

.dock{
    position:fixed;

    bottom:25px;
    left:20px;
    right:20px;

    padding:15px 10px;

    display:flex;
    justify-content:space-around;

    background:rgba(15,20,30,.82);

    backdrop-filter:blur(25px);

    border-radius:30px;

    border:1px solid rgba(255,255,255,.08);

    z-index:100;
}

.dock-btn{
    font-size:32px;
    text-decoration:none;
    opacity:.4;
    color:white;
}

.dock-btn.active{
    opacity:1;

    filter:drop-shadow(0 0 8px var(--accent));
}

</style>
</head>

<body>

<div class="bg-blur" id="bgBlur"></div>
<div class="bg-overlay"></div>

<header>
    <a href="#" class="nav-item active">LIBRARY</a>
    <a href="#" class="nav-item">ADD NEW</a>
</header>

<main class="hero">
    <h1 id="gameTitle">Cargando...</h1>
    <p id="gameDesc">Navegá el ranking.</p>
</main>

<div class="slider-wrapper" id="slider">

<div class="cards-container">

<div class="card active"
data-title="Honor of Kings"
data-desc="¿Por qué está acá? Es el MOBA que más plata recauda en el mundo. Sus torneos millonarios lo hicieron imparable."
data-img="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">

<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRN_7n4vBFt3x1Equgmm3zm8u5ftjjnftoG9IfAT-3lVA&s=10">

<div class="badge">1</div>

</div>

<div class="card"
data-title="Among Us"
data-desc="¿Por qué está acá? Sigue vivo porque corre hasta en una heladera."
data-img="https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Among_Us_cover_art.jpg/250px-Among_Us_cover_art.jpg">

<img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/9a/Among_Us_cover_art.jpg/250px-Among_Us_cover_art.jpg">

<div class="badge">2</div>

</div>

<div class="card"
data-title="Minecraft"
data-desc="¿Por qué está acá? El más vendido de la historia."
data-img="https://artsyfartsy.eu/cdn/shop/files/17028.jpg?v=1760385248&width=320">

<img src="https://artsyfartsy.eu/cdn/shop/files/17028.jpg?v=1760385248&width=320">

<div class="badge">3</div>

</div>

</div>
</div>

<nav class="dock">
    <a href="#" class="dock-btn active">🏠</a>
    <a href="#" class="dock-btn">⭐</a>
    <a href="#" class="dock-btn">📺</a>
    <a href="#" class="dock-btn">💬</a>
    <a href="#" class="dock-btn">👤</a>
</nav>

<script>

const slider = document.getElementById('slider');
const cards = document.querySelectorAll('.card');

const bgBlur = document.getElementById('bgBlur');

const gameTitle = document.getElementById('gameTitle');
const gameDesc = document.getElementById('gameDesc');

function updateActiveCard(){

    const sliderCenter =
        slider.scrollLeft +
        (slider.offsetWidth / 2);

    cards.forEach(card => {

        const cardCenter =
            card.offsetLeft +
            (card.offsetWidth / 2);

        const distance =
            Math.abs(sliderCenter - cardCenter);

        if(distance < 140){

            cards.forEach(c =>
                c.classList.remove('active')
            );

            card.classList.add('active');

            bgBlur.style.backgroundImage =
                `url('${card.dataset.img}')`;

            gameTitle.innerText =
                card.dataset.title;

            gameDesc.innerText =
                card.dataset.desc;
        }
    });
}

slider.addEventListener('scroll', updateActiveCard);

window.onload = () => {

    bgBlur.style.backgroundImage =
    `url('${cards[0].dataset.img}')`;

    updateActiveCard();
};

</script>

</body>
</html>
